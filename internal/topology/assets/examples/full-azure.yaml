# Synthetic compile-only Container Apps example with separately staged optional hosts.
version: 1
backend: azure
features:
  deployment: azure-container-apps
  acquisition: actions
  ingress: public
  analytics: none
  telemetry: none
  sessionDataLake: true
  webhookGateway: true
azure:
  parameters:
    location: eastus
    deploymentName: example-full
    containerRegistryName: examplefullacr
    keyVaultName: example-full-kv
    dashboardImage: examplefullacr.azurecr.io/cao-dashboard@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    provisioningImage: examplefullacr.azurecr.io/cao-provision@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    ingestionImage: examplefullacr.azurecr.io/cao-ingest@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    runtimeEnabled: false
    trustedProxyCidrs: [10.45.0.0/23]
    githubClientId: example-client-id
    githubAllowedOrganizations: [example-org]
    githubAdminUsers: [example-admin]
    postgresRunRetentionDays: 45
  secretVaultId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/example-secrets/providers/Microsoft.KeyVault/vaults/example-secrets
  secrets:
    githubClientSecret: github-client-secret
    sessionSecret: session-secret
    postgresAdministratorPassword: postgres-admin-password
    postgresOwnerPassword: postgres-owner-password
    postgresRuntimePassword: postgres-runtime-password
    githubWebhookSecret: collection-webhook-secret
    archiveOauthClientSecret: archive-oauth-secret
    archiveSessionSecret: archive-session-secret
    archiveEntraClientSecret: archive-entra-secret
    archiveTlsCertificate: archive-tls-certificate
    archiveTlsPrivateKey: archive-tls-key
    gatewayWebhookSecret: gateway-webhook-secret
    gatewayReceivePrivateKey: gateway-receive-key
    gatewayDispatchPrivateKey: gateway-dispatch-key
    gatewayTlsCertificate: gateway-tls-certificate
    gatewayTlsPrivateKey: gateway-tls-key
  hosts:
    sshPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDda2wZf5ue5CdHLV3NAf4Piom8sB3l4t2nNJ1Sp0U7O example-only
    archiveAllowedSourceCidrs: [203.0.113.0/24]
    archiveRepositories: [example-org/example-repo]
    gatewayAllowedSourceCidrs: [192.0.2.0/24]
