name: Target read access probe

run-name: Target read access probe / ${{ inputs.target || 'github/gh-aw' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Enrolled target repository (OWNER/REPO) to probe with the read App.
        required: true
        default: github/gh-aw
        type: string
  pull_request:
    paths:
      - .github/workflows/target-read-access-probe.yml
      - .github/workflows/shared/control.md
      - .github/workflows/shared/github-apps.mjs
      - .github/workflows/shared/value-acquisition.mjs
      - scripts/probe-target-read-access.mjs
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: target-read-access-probe-${{ inputs.target || 'github/gh-aw' }}
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAO_PROBE_TARGET: ${{ inputs.target || 'github/gh-aw' }}
    steps:
      - name: Checkout probe and control policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/workflows/
            scripts/
            /.github/workflows/shared/value-acquisition.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve target read scope
        id: scope
        run: |
          set -euo pipefail
          IFS=/ read -r owner repository extra <<< "$CAO_PROBE_TARGET"
          if [[ -z "$owner" || -z "$repository" || -n "$extra" ]]; then
            echo "Invalid probe target: $CAO_PROBE_TARGET" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Validate target against control-plane policy
        run: node scripts/probe-target-read-access.mjs --scope-only

      - name: Require read App credentials
        env:
          CAO_GITHUB_APP_ID: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          CAO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CAO_GITHUB_APP_ID" || -z "$CAO_GITHUB_APP_PRIVATE_KEY" ]]; then
            echo "GH_AW_GITHUB_READ_APP_ID and GH_AW_GITHUB_READ_APP_PRIVATE_KEY are required to probe target read access" >&2
            exit 1
          fi

      - name: Generate target-scoped read App token
        id: read-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repository }}
          github-api-url: ${{ github.api_url }}
          permission-checks: read
          permission-secret-scanning-alerts: read
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Probe target evidence sources
        env:
          CAO_PROBE_TOKEN: ${{ steps.read-app-token.outputs.token }}
        run: node scripts/probe-target-read-access.mjs
