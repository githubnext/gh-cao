name: Dashboard demo and operational snapshot checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard-deployed-integration.yml
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/site/dashboard-pages/**
      - dashboard/site/src/data/**
      - dashboard/site/src/data-*.js
      - dashboard/site/src/dashboard-chunks.js
      - dashboard/site/src/dashboard-app.js
      - dashboard/site/src/debug.js
      - dashboard/site/src/remote-data-backend.js
      - dashboard/site/src/source-*.js
      - server/cmd/cao-dashboard/**
      - server/internal/query/**
      - server/internal/ingest/**
      - server/internal/postgresx/**
      - server/internal/server/**
      - server/internal/redisx/**
      - server/go.mod
      - server/go.sum
      - dashboard/site/package.json
      - dashboard/site/package-lock.json
      - package.json
      - package-lock.json
      - tests/e2e/dashboard-deployed-refresh-helpers.mjs
      - tests/e2e/dashboard-deployed-refresh.spec.mjs
      - tests/integration/dashboard-deployed-data.test.mjs
      - scripts/simulate-dashboard-pages.mjs
      - tests/helpers/dashboard-pages-preview.mjs
      - tests/e2e/dashboard-view-assessment.mjs
      - tests/helpers/dashboard-query-cost.mjs
      - tests/helpers/dashboard-query-cost-report.mjs
      - tests/performance/dashboard-query-cost-postgres.test.mjs
      - tests/performance/dashboard-query-cost.test.mjs
      - tests/playwright/configs/dashboard-deployed.config.mjs
      - "!server/**/*.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Include operational Activity artifact benchmarks in the daily suite
        type: boolean
        default: false
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: read

concurrency:
  group: dashboard-deployed-integration-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  integration:
    name: Test synthetic enterprise demo
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm --prefix dashboard/site ci --omit=dev --ignore-scripts
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Test synthetic demo refresh and navigation
        id: test
        continue-on-error: true
        run: npm run test:e2e:dashboard-deployed
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-deployed-diagnostics
          path: test-results/dashboard-deployed/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when integration checks fail
        if: steps.test.outcome == 'failure'
        run: exit 1

  query-cost:
    name: Measure operational SQLite and Postgres query cost
    if: github.event_name != 'schedule' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cao"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CAO_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      # Published snapshots include run cohorts older than the hosted 30-day window.
      CAO_POSTGRES_RUN_RETENTION_DAYS: "90"
      # Match the collector's seven-day detail window, not the run-history window.
      CAO_POSTGRES_LINKED_RETENTION_DAYS: "7"
      DASHBOARD_SERVER_BINARY: ${{ github.workspace }}/.tmp/cao-dashboard
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build production query engine
        run: |
          mkdir -p .tmp
          go -C server build -o ../.tmp/cao-dashboard ./cmd/cao-dashboard
      - name: Download operational Activity artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$DEFAULT_BRANCH"
          run_id=$(gh run list --workflow cao-activity.yml --branch "$DEFAULT_BRANCH" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "No successful Activity snapshot run is available" >&2; exit 1; }
          gh run download "$run_id" --name cao-activity-index --dir .cao
          test -s .cao/gh-aw-logs.sqlite
          test -s .cao/payload-hashes.json
          printf 'Activity artifact run: %s\n' "$run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify operational artifact ingestion
        env:
          DASHBOARD_DATA_DIR: .cao
        run: node --test tests/integration/dashboard-deployed-data.test.mjs
      - name: Measure SQLite query cost
        id: sqlite
        continue-on-error: true
        run: npm run test:performance:dashboard-query-cost
      - name: Measure Postgres query cost
        id: postgres
        continue-on-error: true
        run: npm run test:performance:dashboard-query-cost-postgres
      - name: Record benchmark outcomes
        if: always()
        env:
          SQLITE_OUTCOME: ${{ steps.sqlite.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
        run: |
          mkdir -p test-results/dashboard-query-cost
          printf 'sqlite=%s\npostgres=%s\n' "$SQLITE_OUTCOME" "$POSTGRES_OUTCOME" \
            > test-results/dashboard-query-cost/status.txt
      - name: Upload query cost report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-query-cost
          path: test-results/dashboard-query-cost/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when query analysis fails
        if: steps.sqlite.outcome != 'success' || steps.postgres.outcome != 'success'
        run: exit 1

  query-cost-comment:
    name: Report query cost results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), needs.query-cost.result)
    needs: query-cost
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download query cost results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-query-cost
          path: query-cost-results
      - name: Comment with query cost results
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- dashboard-query-cost-results -->'
            const summaryPath = 'query-cost-results/summary.md'
            const postgresPath = 'query-cost-results/postgres/summary.md'
            const maxSummaryLength = 30000
            let summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : 'No SQLite query cost summary was produced.'
            if (summary.length > maxSummaryLength) {
              summary = `${summary.slice(0, maxSummaryLength)}\n\n_Report truncated; see the uploaded artifact for the full report._`
            }
            let postgres = fs.existsSync(postgresPath)
              ? fs.readFileSync(postgresPath, 'utf8').trim()
              : 'No Postgres query cost summary was produced.'
            if (postgres.length > maxSummaryLength) {
              postgres = `${postgres.slice(0, maxSummaryLength)}\n\n_Report truncated; see the uploaded artifact for the full report._`
            }
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const status = fs.existsSync('query-cost-results/status.txt')
              ? fs.readFileSync('query-cost-results/status.txt', 'utf8')
              : ''
            const outcome = [
              status.includes('sqlite=success') ? 'SQLite benchmark passed.' : 'SQLite benchmark failed or did not complete.',
              status.includes('postgres=success') ? 'Postgres/Go benchmark passed.' : 'Postgres/Go benchmark failed or did not complete.',
            ].join(' ')
            const body = [
              marker,
              '<details><summary><b>SQLite query cost report</b></summary>',
              '',
              summary,
              '',
              '</details>',
              '',
              '<details><summary><b>Postgres query cost report</b></summary>',
              '',
              postgres,
              '',
              '</details>',
              '',
              outcome,
              '',
              `[View the workflow run and query cost artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  report-failure:
    name: Report synthetic demo failure
    if: always() && needs.integration.result == 'failure'
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Synthetic CAO demo integration failure'
            const marker = '<!-- deployed-dashboard-integration-failure -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              'The synthetic enterprise demo browser check failed. This is not an operational freshness or completeness check.',
              '',
              `Workflow run: ${runUrl}`,
              '',
              'Download the `dashboard-deployed-diagnostics` artifact for the bounded browser, database, and rendering report.',
            ].join('\n')
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['bug'],
              })
            }
