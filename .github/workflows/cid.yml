name: Dashboard CI

on:
  pull_request:
    paths:
      - .github/workflows/cid.yml
      - dashboard/site/**
      - server/cmd/cao-dashboard/serve_pages*.go
      - scripts/simulate-dashboard-pages.mjs
      - tests/helpers/dashboard-pages-preview.mjs
      - tests/e2e/dashboard-pages.spec.mjs
      - tests/playwright/configs/dashboard-pages.config.mjs
      - docs/assets/logo-day.svg
      - docs/assets/logo-night.svg
      - public/favicon.svg
      - "!dashboard/site/**/*.md"
  push:
    branches: [main]
    paths:
      - .github/workflows/cid.yml
      - dashboard/report/query-complexity.mjs
      - dashboard/site/**
      - server/cmd/cao-dashboard/serve_pages*.go
      - scripts/simulate-dashboard-pages.mjs
      - tests/helpers/dashboard-pages-preview.mjs
      - tests/e2e/dashboard-pages.spec.mjs
      - tests/playwright/configs/dashboard-pages.config.mjs
      - docs/assets/logo-day.svg
      - docs/assets/logo-night.svg
      - public/favicon.svg
      - tests/unit/cao-dashboard-complexity.test.mjs
      - tests/playwright/configs/dashboard-ingestion.config.mjs
      - tests/e2e/dashboard-ingestion-scale.spec.mjs
      - tests/helpers/synthetic-gh-aw-logs.mjs
      - package.json
      - package-lock.json
      - "!dashboard/site/**/*.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    name: Go Pages and IndexedDB
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm --prefix dashboard/site ci --omit=dev --ignore-scripts
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Test Pages deployment
        run: npm run test:e2e:dashboard-pages
      - name: Upload Pages evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-pages-evidence
          path: test-results/dashboard-pages/
          if-no-files-found: error
          retention-days: 14

  lint-unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  playwright-integration:
    name: Playwright integration tests (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Build canvas Go host outside browser test deadlines
        run: |
          go -C ../../server build -o "$RUNNER_TEMP/cao-dashboard" ./cmd/cao-dashboard
          echo "CAO_DASHBOARD_EXECUTABLE=$RUNNER_TEMP/cao-dashboard" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-24.04-${{ runner.arch }}-playwright-${{ hashFiles('dashboard/site/package-lock.json') }}-chromium-webkit
      - name: Install Chromium and WebKit
        # Playwright's system dependencies come from the Ubuntu archives. The runner
        # image also configures Google's Chrome repository, whose index intermittently
        # fails checksum verification and breaks `apt-get update`; CI never installs
        # from it, so drop it before resolving dependencies.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Retain browser test reports and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-browser-shard-${{ strategy.job-index }}
          path: |
            dashboard/site/test-results/
            dashboard/site/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  ingestion-scale:
    name: Synthetic ingestion scale test
    # The synthetic payload ingestion is slow, so keep it on main instead of
    # every pull request.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
      - name: Install Chromium
        # Playwright's system dependencies come from the Ubuntu archives. The runner
        # image also configures Google's Chrome repository, whose index intermittently
        # fails checksum verification and breaks `apt-get update`; CI never installs
        # from it, so drop it before resolving dependencies.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Synthetic ingestion scale test
        run: npm run test:e2e:dashboard-ingestion

  dead-views:
    name: Dashboard dead views
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Render dead views
        run: |
          npm run --silent analyze:dead-views > dead-views.md
          cat dead-views.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dead views report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dead-views
          path: dashboard/site/dead-views.md
          if-no-files-found: error
          retention-days: 14

  dead-views-comment:
    name: Report dashboard dead views
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.dead-views.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: dead-views
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download dead views report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dead-views
          path: dead-views
      - name: Comment with dead views
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const reportPath = 'dead-views/dead-views.md'
            if (!fs.existsSync(reportPath)) {
              core.warning(`Dead views report is unavailable at ${reportPath}; skipping PR feedback.`)
              return
            }
            const marker = '<!-- dashboard-dead-views -->'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const report = fs.readFileSync(reportPath, 'utf8').trim()
            const body = [
              marker,
              '<details><summary><b>Dashboard dead views</b></summary>',
              '',
              report,
              '',
              '</details>',
              '',
              '⚠️ This reachability report is informational and does not block the pull request.',
              `🔎 [View the workflow run and report artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.filter((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            const deleteComments = async (commentsToDelete) => {
              const results = await Promise.allSettled(commentsToDelete.map((comment) =>
                github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                })
              ))
              results.forEach((result, index) => {
                if (result.status === 'rejected') {
                  core.warning(`Could not delete dead views comment ${commentsToDelete[index].id}: ${result.reason}`)
                }
              })
            }
            if (existing.length > 0) {
              await deleteComments(existing.slice(1))
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing[0].id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  query-complexity:
    name: Dashboard query complexity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Analyze dashboard query complexity
        run: |
          node scripts/dashboard-query-complexity.mjs \
            dashboard/site/dashboard.json > query-complexity.md
          cat query-complexity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload query complexity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-query-complexity
          path: query-complexity.md
          if-no-files-found: error
          retention-days: 14

  query-complexity-comment:
    name: Report dashboard query complexity
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.query-complexity.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: query-complexity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download query complexity report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-query-complexity
          path: query-complexity
      - name: Comment with query complexity ranking
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const reportPath = 'query-complexity/query-complexity.md'
            if (!fs.existsSync(reportPath)) {
              core.warning(`Query complexity report is unavailable at ${reportPath}; skipping PR feedback.`)
              return
            }
            const marker = '<!-- dashboard-query-complexity -->'
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const report = fs.readFileSync(reportPath, 'utf8').trim()
            const maximumReportLength = 60000
            const boundedReport = report.length <= maximumReportLength
              ? report
              : `${report.slice(0, maximumReportLength)}\n\n_Report truncated; see the workflow artifact for the complete ranking._`
            const body = [
              marker,
              '<details><summary><b>Query complexity report</b></summary>',
              '',
              boundedReport,
              '',
              '</details>',
              '',
              '⚠️ This structural estimate is informational and does not block the pull request.',
              `🔎 [View the workflow run and complete report artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.filter((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            const deleteComments = async (commentsToDelete) => {
              const results = await Promise.allSettled(commentsToDelete.map((comment) =>
                github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                })
              ))
              results.forEach((result, index) => {
                if (result.status === 'rejected') {
                  core.warning(`Could not delete query complexity comment ${commentsToDelete[index].id}: ${result.reason}`)
                }
              })
            }
            if (existing.length > 0) {
              await deleteComments(existing.slice(1))
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing[0].id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  lighthouse-performance:
    name: Lighthouse performance scenarios
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('dashboard/site/package-lock.json') }}-chromium
      - name: Install Chromium
        # Playwright's system dependencies come from the Ubuntu archives. The runner
        # image also configures Google's Chrome repository, whose index intermittently
        # fails checksum verification and breaks `apt-get update`; CI never installs
        # from it, so drop it before resolving dependencies.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Run performance scenarios
        run: npm run test:performance
      - name: Upload performance traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-lighthouse-performance
          path: dashboard/site/test-results/lighthouse/
          if-no-files-found: warn
          retention-days: 14

  lighthouse-comment:
    name: Report Lighthouse results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.lighthouse-performance.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: lighthouse-performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Download Lighthouse results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-lighthouse-performance
          path: lighthouse-results
      - name: Comment with Lighthouse results
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const summaryPath = 'lighthouse-results/summary.json'
            if (!fs.existsSync(summaryPath)) {
              core.warning(`Lighthouse summary is unavailable at ${summaryPath}; skipping PR feedback.`)
              return
            }
            let summary
            try {
              summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error)
              core.warning(`Could not read the Lighthouse summary; skipping PR feedback: ${message}`)
              return
            }
            if (!summary || summary.status !== 'complete' || !Array.isArray(summary.results)) {
              core.warning('Lighthouse summary has an unexpected shape; skipping PR feedback')
              return
            }
            const validResults = summary.results.filter((result) =>
              result && Array.isArray(result.failures)
            )
            if (validResults.length !== summary.results.length) {
              core.warning('Lighthouse summary contains unexpected results; skipping malformed entries')
            }
            if (validResults.length === 0) {
              core.warning('Lighthouse summary contains no usable results; skipping PR feedback')
              return
            }
            const degraded = validResults.filter((result) => result.failures.length > 0)

            const headOwner = context.payload.pull_request.head.repo.owner.login
            const headBranch = context.payload.pull_request.head.ref
            let pull = context.payload.pull_request
            try {
              const { data: pulls } = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                head: `${headOwner}:${headBranch}`,
              })
              const branchPull = pulls.find(({ head }) =>
                head.ref === headBranch && head.repo?.owner.login === headOwner
              )
              if (branchPull) {
                pull = branchPull
              } else {
                core.warning(`No open pull request found for ${headOwner}:${headBranch}; using event pull request.`)
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error)
              core.warning(`Could not find the pull request by branch; using event pull request: ${message}`)
            }

            const marker = '<!-- dashboard-lighthouse-results -->'
            const legacyMarker = '<!-- dashboard-lighthouse-degradation -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull.number,
              per_page: 100,
            })
            const existing = comments.filter((comment) =>
              comment.user?.type === 'Bot' &&
              (comment.body?.includes(marker) || comment.body?.includes(legacyMarker))
            )
            const deleteComments = async (commentsToDelete) => {
              const results = await Promise.allSettled(commentsToDelete.map((comment) =>
                github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                })
              ))
              results.forEach((result, index) => {
                if (result.status === 'rejected') {
                  core.warning(`Could not delete existing Lighthouse comment ${commentsToDelete[index].id}: ${result.reason}`)
                }
              })
            }
            const labels = {
              'cumulative-layout-shift': 'Cumulative Layout Shift',
              'first-contentful-paint': 'First Contentful Paint',
              'largest-contentful-paint': 'Largest Contentful Paint',
              'speed-index': 'Speed Index',
              'total-blocking-time': 'Total Blocking Time',
            }
            const formatMetric = (name, value) => {
              if (typeof value !== 'number' || Number.isNaN(value)) return 'n/a'
              return name === 'cumulative-layout-shift' ? value.toFixed(3) : `${Math.round(value)} ms`
            }
            const sections = validResults.map((result) => {
              const budgets = result.budgets && typeof result.budgets === 'object' ? result.budgets : {}
              const metrics = result.metrics && typeof result.metrics === 'object' ? result.metrics : {}
              const scoreFailed = result.score < result.passingScore
              const rows = [
                `| 📊 Performance score | ${scoreFailed ? '❌' : '✅'} | ` +
                `${Math.round(result.score * 100)} | ${Math.round(result.passingScore * 100)} (minimum) |`,
              ]
              for (const [name, budget] of Object.entries(budgets)) {
                const value = metrics[name]
                const exceeded = typeof value === 'number' && value > budget
                rows.push(
                  `| 📏 ${labels[name] || name} | ${exceeded ? '❌' : '✅'} | ` +
                  `${formatMetric(name, value)} | ${formatMetric(name, budget)} (budget) |`
                )
              }
              const status = result.failures.length > 0 ? '❌' : '✅'
              return [
                `<details><summary>${status} 👤🚦 <b>${result.persona}</b> (<code>${result.id}</code>)</summary>`,
                '',
                '| Measurement | Status | Value | Threshold |',
                '| --- | --- | --- | --- |',
                ...rows,
                '',
                '</details>',
              ].join('\n')
            })
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const heading = degraded.length > 0
              ? '### 📉🚦 Dashboard Lighthouse performance degraded'
              : '### 📈🚦 Dashboard Lighthouse performance results'
            const verdict = degraded.length > 0
              ? `🧭 ${degraded.length} of ${validResults.length} scenarios are outside their configured thresholds.`
              : `🧭 All ${validResults.length} scenarios meet their configured thresholds.`
            const body = [
              marker,
              heading,
              '',
              '⚠️ The Lighthouse check is informational and does not block this pull request.',
              verdict,
              '',
              sections.join('\n\n'),
              '',
              `🔎 [View the workflow run and performance artifacts](${runUrl}).`,
            ].join('\n')

            if (existing.length > 0) {
              await deleteComments(existing.slice(1))
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing[0].id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull.number,
                body,
              })
            }
