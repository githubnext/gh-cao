name: Podman integration

on:
  pull_request:
    paths:
      - .github/workflows/podman.yml
      - scripts/container-*.sh
      - scripts/azure-local/**
      - server/**
      - tests/unit/container-engine.test.mjs
      - tests/unit/podman-ci.test.mjs
      - tests/unit/azure-local-*.test.mjs
      - tests/integration/azure-local-*.test.mjs
      - go.mod
      - go.sum
      - package.json
      - .github/workflows/cao.json
      - .github/workflows/cao.azure.json
  push:
    branches: [main]
    paths:
      - .github/workflows/podman.yml
      - scripts/container-*.sh
      - scripts/azure-local/**
      - server/**
      - tests/unit/container-engine.test.mjs
      - tests/unit/podman-ci.test.mjs
      - tests/unit/azure-local-*.test.mjs
      - tests/integration/azure-local-*.test.mjs
      - go.mod
      - go.sum
      - package.json
      - .github/workflows/cao.json
      - .github/workflows/cao.azure.json
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: podman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  podman:
    name: Rootless Podman lifecycle and local Azure services
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAO_CONTAINER_ENGINE: podman
      CAO_TEST_PODMAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
          cache-dependency-path: |
            go.sum
            server/go.sum
      - name: Restore checksum-verified Azure Functions Core Tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/azure-local/tools
          key: podman-core-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/azure-local/azure-local.sh') }}
      - name: Prepare rootless Podman with a delegated user session
        run: |
          missing=()
          for tool in podman newuidmap slirp4netns fuse-overlayfs crun; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs crun
          fi
          test "$(id -u)" -ne 0
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Prepare Go dependencies before hermetic service tests
        run: go mod download && go -C server mod download
      - name: Run independent rootless and Azure checks concurrently
        run: |
          boundary() {
            image="$(sed -n 's/^const DefaultContainerImage = "\(.*\)"$/\1/p' server/internal/hostedcli/container_runner.go)"
            [[ "$image" =~ ^ghcr.io/github/gh-aw@sha256:[0-9a-f]{64}$ ]]
            podman --remote=false pull "$image"
            systemd-run --user --scope --property=Delegate=yes \
              go -C server test -race ./internal/hostedcli \
              -run '^TestPodmanRealBoundary$' -count=1 -timeout=5m -v
          }
          boundary &
          boundary_pid=$!
          npm run test:integration:azure-services &
          azure_pid=$!
          node --test tests/unit/container-engine.test.mjs tests/unit/azure-local-*.test.mjs &
          contracts_pid=$!
          status=0
          wait "$boundary_pid" || status=$?
          wait "$azure_pid" || status=$?
          wait "$contracts_pid" || status=$?
          exit "$status"
