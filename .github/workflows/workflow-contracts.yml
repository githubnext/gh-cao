name: Workflow contracts

on:
  pull_request:
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workflow-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected contract areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      integration: ${{ steps.plan.outputs.integration }}
      documentation: ${{ steps.plan.outputs.documentation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-test-plan.mjs

  installer:
    name: Public installer integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test real public downloads with unusable cross-organization tokens
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run test:integration:installer

  agent-plugin:
    name: Install agent plugin with Copilot CLI
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Copilot CLI
        run: npm_config_before="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)" npm install -g @github/copilot # zizmor: ignore[adhoc-packages] - This compatibility test intentionally exercises the latest available Copilot CLI.
      - name: Install agent plugin
        run: copilot plugin install "$(pwd)"

  unit:
    name: Unit contracts (${{ matrix.area }})
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Terminal contracts need node-pty's native build and terminal preparation.
      - name: Install dashboard dependencies
        if: matrix.area == 'dashboard'
        run: npm ci --prefix dashboard/site
      - name: Install gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run ${{ matrix.area }} unit contracts
        env:
          UNIT_AREA: ${{ matrix.area }}
        run: npm run test:unit:area -- "$UNIT_AREA"

  fast-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run fast contract checks
        run: |
          npm run lint
          npm run typecheck:cao
          npm run typecheck:copilot
          npm run compile
      - name: Check patch formatting
        run: git diff --check

  test:
    needs: [changes, unit, fast-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  full-contracts:
    name: Integration, load, API, and documentation contracts
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard/site
      - name: Install gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run integration and load contracts
        if: needs.changes.outputs.integration == 'true'
        run: |
          npm run test:integration
          npm run test:load
      - name: Verify versioned server API signatures
        if: needs.changes.outputs.integration == 'true'
        run: |
          npm --prefix server/spec ci
          npm run dashboard:server:spec:check
      - name: Build and validate documentation
        if: ${{ !cancelled() && needs.changes.outputs.documentation == 'true' }}
        run: |
          npm run check:svg
          npm run docs:build

  github-issue-query:
    name: GitHub issue GraphQL integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test issueOrPullRequest query
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test tests/integration/github-issue-or-pull-request.test.mjs

  dependabot-operational-value:
    name: Dependabot operational value integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cao_value_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cao_value_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: 1.27.3
          cache-dependency-path: |
            server/go.sum
            internal/dashboardquery/go.sum
      - name: Set up Node for the frozen value oracle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify native Dependabot operational value
        env:
          CAO_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cao_value_test?sslmode=disable
        run: >-
          go -C server test -race ./internal/collect ./internal/operationalvalue
          -run '^(TestDependabot|TestHostedDependabot|TestNativeLocalValueNumericDependabot)'
          -count=1 -timeout=3m -v
  campaign-lifecycle-changes:
    name: Select campaign lifecycle tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.matrix.outputs.has-changes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build campaign test matrix
        id: matrix
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            matrix="$(node scripts/campaign-lifecycle-matrix.mjs --all)"
          else
            matrix="$(node scripts/campaign-lifecycle-matrix.mjs "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

  campaign-lifecycle:
    needs: campaign-lifecycle-changes
    if: github.event_name != 'pull_request' && needs.campaign-lifecycle-changes.outputs.has-changes == 'true'
    name: Campaign lifecycle (${{ matrix.name }})
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.campaign-lifecycle-changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check campaign API capacity
        id: campaign-api
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_COMPLETE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if (( remaining < 500 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Campaign lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining; 500 are required for clean-room campaign tests."
            echo "Campaign lifecycle tests were skipped because the shared GitHub App installation API quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$REQUIRE_COMPLETE" == "true" ]]; then exit 1; fi
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gh-aw
        if: steps.campaign-api.outputs.ready == 'true'
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run campaign lifecycle integration
        if: steps.campaign-api.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--test-name-pattern="${{ matrix.test-pattern }}"'
          REQUIRE_COMPLETE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          # gh-aw only classifies a 40-character hex ref as a commit SHA; an abbreviated
          # SHA is treated as a branch name, so `gh aw update` resolves the campaign
          # source against a branch that does not exist. Pin the full commit SHA, as the
          # release workflow already does.
          export CENTRAL_AGENTIC_OPS_CAMPAIGN_SOURCE="${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          set +e
          output="$(npm run test:campaign-lifecycle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
            exit 0
          fi
          if grep -Fq "API rate limit exceeded for installation" <<< "$output"; then
            echo "::warning title=Campaign lifecycle incomplete::The shared GitHub App installation API quota was exhausted during clean-room campaign tests."
            echo "Campaign lifecycle tests became inconclusive because the shared GitHub App installation API quota was exhausted during the run." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$REQUIRE_COMPLETE" == "true" ]]; then exit 1; fi
            exit 0
          fi
          # `gh aw update` swallows the underlying error for a package that installs no
          # agentic workflows, so an exhausted quota surfaces only as "no workflows were
          # successfully updated". The run started with at least 500 core requests, so a
          # quota that is now spent is itself the rate-limit evidence the grep cannot see.
          remaining="$(gh api rate_limit --jq '.resources.core.remaining' || echo 500)"
          if (( remaining < 50 )); then
            echo "::warning title=Campaign lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining after the clean-room campaign tests."
            echo "Campaign lifecycle tests became inconclusive because the shared GitHub App installation API quota was exhausted during the run." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$REQUIRE_COMPLETE" == "true" ]]; then exit 1; fi
            exit 0
          fi
          exit "$status"
