name: Synthetic demo mobile integration

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - .github/workflows/actions.yml
      - dashboard/site/**
      - server/cmd/cao-dashboard/**
      - server/go.mod
      - server/go.sum
      - scripts/simulate-dashboard-pages.mjs
      - tests/helpers/dashboard-pages-preview.mjs
      - dashboard/report/**
      - "**/dashboard.json"
      - "**/dashboard-fragments/**"
      - package.json
      - package-lock.json
      - tests/playwright/configs/mobile.config.mjs
      - tests/e2e/dashboard-mobile-live.spec.mjs
      - tests/e2e/dashboard-deployed-refresh-helpers.mjs
      - tests/e2e/dashboard-screenshot.mjs
      - tests/e2e/dashboard-tree-analysis.mjs
      - "!dashboard/site/**/*.md"

permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-dashboard-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOBILE_DEBUG_SHARD_LIMIT: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[{"browser":"webkit","device":"iPhone 15"},{"browser":"chromium","device":"Pixel 7"}]' || '[{"browser":"webkit","device":"iPhone 15"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm --prefix dashboard/site ci --omit=dev --ignore-scripts
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install browser
        # Playwright's system dependencies come from the Ubuntu archives. The runner
        # image also configures Google's Chrome repository, whose index intermittently
        # fails checksum verification and breaks `apt-get update`; CI never installs
        # from it, so drop it before resolving dependencies.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps "$MOBILE_BROWSER"
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
      - name: Test synthetic enterprise demo on mobile
        run: npx playwright test --config=tests/playwright/configs/mobile.config.mjs
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
          MOBILE_DEVICE: ${{ matrix.device }}
          MOBILE_PROFILE: baseline
      - name: Test mobile dashboard with restricted memory
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: npx playwright test --config=tests/playwright/configs/mobile.config.mjs
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
          MOBILE_DEVICE: ${{ matrix.device }}
          MOBILE_PROFILE: low-memory
          MOBILE_MEMORY_MB: 256
      - name: Test mobile dashboard with throttled network
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: npx playwright test --config=tests/playwright/configs/mobile.config.mjs
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
          MOBILE_DEVICE: ${{ matrix.device }}
          MOBILE_PROFILE: slow-network
          MOBILE_NETWORK_DOWNLOAD_KBPS: 1600
          MOBILE_NETWORK_UPLOAD_KBPS: 750
          MOBILE_NETWORK_LATENCY_MS: 150
      - name: Test mobile dashboard with restricted memory and network
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        run: npx playwright test --config=tests/playwright/configs/mobile.config.mjs
        env:
          MOBILE_BROWSER: ${{ matrix.browser }}
          MOBILE_DEVICE: ${{ matrix.device }}
          MOBILE_PROFILE: low-memory-slow-network
          MOBILE_MEMORY_MB: 256
          MOBILE_NETWORK_DOWNLOAD_KBPS: 1600
          MOBILE_NETWORK_UPLOAD_KBPS: 750
          MOBILE_NETWORK_LATENCY_MS: 150
      - name: Upload mobile analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-dashboard-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 1

  mobile-analysis-comment:
    name: Report mobile dashboard analysis
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download mobile analysis evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mobile-dashboard-*
          path: mobile-analysis
          merge-multiple: true
      - name: Comment with mobile analysis
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            if (!fs.existsSync('mobile-analysis')) {
              core.warning('No mobile dashboard analysis artifacts were found; skipping PR feedback.')
              return
            }
            const find = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name)
              return entry.isDirectory()
                ? find(target)
                : entry.name === 'mobile-dashboard-analysis.json' ? [target] : []
            })
            const files = find('mobile-analysis')
            if (files.length === 0) {
              core.warning('No mobile dashboard analysis files were found; skipping PR feedback.')
              return
            }
            const analyses = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')))
              .sort((left, right) =>
                `${left.browser}:${left.profile}`.localeCompare(`${right.browser}:${right.profile}`)
              )
            const formatBytes = (value) => value == null ? 'n/a' : `${(value / 1024 / 1024).toFixed(1)} MiB`
            const rows = analyses.map((analysis) => {
              const memory = analysis.constraints?.memoryMb ? `${analysis.constraints.memoryMb} MiB` : 'default'
              const network = analysis.constraints?.network
              const networkLabel = network
                ? `${network.downloadKbps}/${network.uploadKbps} Kbps, ${network.latencyMs} ms`
                : 'default'
              const mobileAccessibility = analysis.mobileAccessibility
              const targetSize = !mobileAccessibility
                ? 'n/a'
                : mobileAccessibility.targets.total === 0
                  ? 'n/a (no visible targets)'
                  : `${mobileAccessibility.targets.undersized.length === 0 ? 'Pass' : 'Fail'} (${mobileAccessibility.targets.minimumWidth}px width min, ${mobileAccessibility.targets.minimumHeight}px height min)`
              const reflow = mobileAccessibility ? (mobileAccessibility.reflow.passes ? 'Pass' : 'Fail') : 'n/a'
              const zoom = mobileAccessibility ? (mobileAccessibility.zoom.passes ? 'Pass' : 'Fail') : 'n/a'
              const names = mobileAccessibility
                ? `${mobileAccessibility.accessibleNames.passes ? 'Pass' : 'Fail'} (${mobileAccessibility.accessibleNames.unnamedInteractive.length} unnamed)`
                : 'n/a'
              return `| ${analysis.device} | ${analysis.browser} | ${analysis.profile} | ${memory} | ${networkLabel} | ${analysis.dom.totalElements} | ${analysis.runtime?.navigation?.loadMs ?? 'n/a'} | ${formatBytes(analysis.memory?.peakProcessTreePss?.processTreePssBytes)} | ${formatBytes(analysis.memory?.peakJsHeap?.jsHeapUsedSize)} | ${formatBytes(analysis.memory?.afterGarbageCollection?.jsHeapUsedSize)} | ${formatBytes(analysis.sourcePayload?.totalBytes)} | ${targetSize} | ${reflow} | ${zoom} | ${names} |`
            })
            const marker = '<!-- mobile-dashboard-analysis -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### Synthetic enterprise demo mobile analysis',
              'Synthetic browser UX evidence only; not operational freshness or completeness evidence.',
              '',
              `Analyzed ${analyses.length} device/browser profile${analyses.length === 1 ? '' : 's'}.`,
              '',
              '<details><summary><b>Mobile analysis measurements</b></summary>',
              '',
              '| Device | Browser | Profile | Memory limit | Network down/up, latency | DOM elements | Load (ms) | Peak process PSS | Peak JS heap | Retained JS heap | Source payload | Visible target size | Visible reflow | Zoom | Visible accessible names |',
              '| --- | --- | --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- | --- | --- |',
              ...rows,
              '',
              '</details>',
              '',
              `[View detailed JSON, accessibility trees, traces, and screenshots in the workflow artifacts.](${runUrl})`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
