name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache: false
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/site/package-lock.json
            server/spec/package-lock.json
      - name: Install PostgreSQL client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install root npm dependencies
        run: npm ci
      - name: Install dashboard npm dependencies
        run: npm ci
        working-directory: dashboard/site
      - name: Install server spec npm dependencies
        run: npm ci
        working-directory: server/spec
      - name: Install gh-aw extension
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Stage CAO dashboard evidence
        if: vars.CAO_DASHBOARD_DATA_URL != ''
        env:
          DASHBOARD_DATA_URL: ${{ vars.CAO_DASHBOARD_DATA_URL }}
        run: go run ./cmd/gh-cao download
      - name: Report unconfigured operational evidence
        if: vars.CAO_DASHBOARD_DATA_URL == ''
        run: |
          echo "::notice::Operational dashboard evidence is not staged. Provide an explicitly acquired verified snapshot in .cao, or configure CAO_DASHBOARD_DATA_URL. Pages is synthetic demo data, not a fallback."
