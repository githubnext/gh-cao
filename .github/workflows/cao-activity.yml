name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
      fast:
        description: Collect at most 10 runs per repository with smaller download budgets; retain existing history and skip new operational-value computation.
        required: false
        default: false
        type: boolean
      force-recycle:
        description: Recycle restored raw shards and clear disposable normalization payload caches before collection and fragment download.
        required: false
        default: false
        type: boolean
      recycle-only:
        description: Maintain and rebuild the restored snapshot without repository collection or GitHub API evidence requests.
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/cao.json
      - .github/workflows/cao-activity.yml
      - .github/workflows/cao-value-local.yml
      - .github/workflows/cao-dashboard.yml
      - ".github/value-collectors/**"
      - ".github/value-evidence/**"
      - ".github/skills/add-operational-value/**"
      - "activity/**"
      - "dashboard/**"
      - "*/dashboard.json"
      - "*/operational-value.mjs"
      - "*/operational-value/**"
  schedule:
    - cron: "7 * * * *"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  security-events: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch && format('central-agentic-ops-activity-preview-{0}', github.ref) || 'central-agentic-ops-activity' }}
  cancel-in-progress: false

env:
  REPORT_MAX_CACHE_BYTES: ${{ vars.CAO_ACTIVITY_MAX_RAW_CACHE_BYTES || '1073741824' }}
  REPORT_MAX_NORMALIZED_CACHE_BYTES: ${{ vars.CAO_ACTIVITY_MAX_NORMALIZED_CACHE_BYTES || '268435456' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cache-key: ${{ steps.activity-cache-key.outputs.value }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Resolve dashboard control settings
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity"
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$REPORT_CONTROL_SETTINGS"

      - name: Resolve activity collection plan
        id: plan
        if: ${{ inputs.recycle-only != true }}
        env:
          ACTIVITY_AUTH_MODE: ${{ vars.GH_AW_GITHUB_AUTH_MODE || 'workflow-token' }}
          ACTIVITY_PAT_REPOSITORIES: ${{ vars.GH_AW_GITHUB_READ_PAT_REPOSITORIES }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity/control-settings.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { activityCollectionPlan } from "./activity/authentication.mjs";
          const settings = JSON.parse(readFileSync(process.env.REPORT_CONTROL_SETTINGS, "utf8"));
          const include = activityCollectionPlan(settings, {
            authMode: process.env.ACTIVITY_AUTH_MODE,
            controlRepository: process.env.GITHUB_REPOSITORY,
            patRepositoryMap: process.env.ACTIVITY_PAT_REPOSITORIES,
          });
          console.log(`Resolved ${include.length} independently authenticated Activity scopes`);
          process.stdout.write("");
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`));
          EOF

      - name: Resolve activity cache key
        id: activity-cache-key
        run: echo "value=cao-activity-v5-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    if: ${{ inputs.recycle-only != true }}
    strategy:
      fail-fast: false
      # Owner-scoped PATs can share the same user's API quota.
      max-parallel: ${{ vars.GH_AW_GITHUB_AUTH_MODE == 'pat' && 1 || 256 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Configure GitHub CLI host
        run: echo "GH_HOST=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_ENV"

      - name: Restore activity cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
            ${{ runner.temp }}/cao-activity/workflow-value-workspaces
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v5-

      - name: Force recycling of restored activity cache
        if: ${{ inputs.force-recycle == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards"
          node activity/cao.mjs recycle-cache \
            --input-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards" \
            --retention-days 30 --max-bytes "$REPORT_MAX_CACHE_BYTES"
          node --input-type=module <<'EOF'
          import { pruneNormalizationCaches } from "./activity/cli/cache.mjs";
          const directories = ["runs", "records", "normalized"].map(
            (phase) => `${process.env.RUNNER_TEMP}/cao-activity/gh-aw-logs-${phase}/.payloads`
          );
          console.log(await pruneNormalizationCaches(directories, { maxBytes: 0 }));
          EOF

      - name: Generate owner-scoped GitHub App token
        id: activity-app-token
        if: ${{ vars.GH_AW_GITHUB_AUTH_MODE == 'app' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ join(matrix.repositories, ',') }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - name: Select independent activity credential
        id: activity-credential
        env:
          ACTIVITY_AUTH_MODE: ${{ vars.GH_AW_GITHUB_AUTH_MODE || 'workflow-token' }}
          ACTIVITY_APP_TOKEN: ${{ steps.activity-app-token.outputs.token }}
          ACTIVITY_OWNER: ${{ matrix.owner }}
          ACTIVITY_PAT_TOKEN: ${{ vars.GH_AW_GITHUB_AUTH_MODE == 'pat' && secrets[fromJSON(vars.GH_AW_GITHUB_READ_PAT_REPOSITORIES || '{}')[matrix.credentialRepository]] || '' }} # zizmor: ignore[overprovisioned-secrets] - the validated repository map selects exactly one owner-scoped secret for this matrix group.
          ACTIVITY_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ACTIVITY_AUTH_MODE" in
            app) token="$ACTIVITY_APP_TOKEN" ;;
            pat) token="$ACTIVITY_PAT_TOKEN" ;;
            workflow-token) token="$ACTIVITY_WORKFLOW_TOKEN" ;;
            *) echo "GH_AW_GITHUB_AUTH_MODE must select app, pat, or workflow-token" >&2; exit 1 ;;
          esac
          if [[ -z "$token" ]]; then
            echo "The selected $ACTIVITY_AUTH_MODE credential is unavailable for $ACTIVITY_OWNER" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Reserve reviewed Value API capacity
        id: value-api-capacity
        env:
          ACTIVITY_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          ACTIVITY_BASE_RESERVE: ${{ (vars.GH_AW_GITHUB_AUTH_MODE == '' || vars.GH_AW_GITHUB_AUTH_MODE == 'workflow-token') && '100' || '2000' }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          import { loadPolicyFile } from './.github/workflows/shared/policy.mjs';
          import { workflowValueApiHeadroom } from './activity/workflow-value-status.mjs';
          const policy = loadPolicyFile('.github/workflows/cao.json');
          const repositories = JSON.parse(process.env.ACTIVITY_REPOSITORIES_JSON);
          const base = Number(process.env.ACTIVITY_BASE_RESERVE);
          const headroom = workflowValueApiHeadroom(policy, repositories);
          if (!Number.isSafeInteger(base) || base < 0 || !Number.isSafeInteger(headroom)) {
            throw new Error('Invalid Activity/Value API reserve');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `log-floor=-${base + headroom}\nvalue-reserve=${base}\n`);
          EOF

      - name: Resolve owner-scoped control settings
        env:
          ACTIVITY_OWNER: ${{ matrix.owner }}
          ACTIVITY_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        run: |
          mkdir -p "$(dirname "$REPORT_CONTROL_SETTINGS")"
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity-control-settings.json"
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const settings = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/cao-activity-control-settings.json`, "utf8"));
          const repositories = JSON.parse(process.env.ACTIVITY_REPOSITORIES_JSON);
          settings.allowed_owners = [process.env.ACTIVITY_OWNER];
          settings.allowed_repositories = repositories;
          writeFileSync(process.env.REPORT_CONTROL_SETTINGS, `${JSON.stringify(settings, null, 2)}\n`);
          EOF

      - name: Validate public-only repository boundary before discovery
        if: ${{ matrix.publicOnly == true }}
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.activity-credential.outputs.token }}
          script: |
            const { pathToFileURL } = require('url')
            const visibility = await import(pathToFileURL(require('path').resolve('activity/repository-visibility.mjs')).href)
            await visibility.main({ core, github, context, exec, io, getOctokit }, [process.env.REPORT_CONTROL_SETTINGS])

      - name: Resolve gh-aw compiler version
        id: gh-aw-compiler
        run: |
          version="$(node .github/workflows/shared/control.mjs compiler-version .github/workflows/cao.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@221ba4f4319de6b8e809d1a15528b3ae6a818aa5 # v1.0.1
        with:
          version: ${{ steps.gh-aw-compiler.outputs.version }}

      - name: Collect owner-scoped dashboard inventory
        env:
          ACTIVITY_CREDENTIAL_OWNER: ${{ matrix.owner }}
          REPORT_MAX_GITHUB_API_RATE_LIMIT: ${{ steps.value-api-capacity.outputs.log-floor }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
          REPORT_INVENTORY: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-plane-inventory.json
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
        run: |
          discovery_args=()
          if node activity/github-telemetry.mjs capacity "$REPORT_MAX_GITHUB_API_RATE_LIMIT"; then
            echo "API capacity is available for remote inventory."
          else
            capacity_exit_code=$?
            if [[ "$capacity_exit_code" -ne 75 ]]; then
              exit "$capacity_exit_code"
            fi
            echo "::warning::API capacity is reserved; using partial local inventory."
            discovery_args+=(--offline)
          fi
          node activity/cao.mjs discover-workflows \
            --control-settings "$REPORT_CONTROL_SETTINGS" \
            --inventory "$REPORT_INVENTORY" \
            --output "$REPORT_INVENTORY_SOURCES" \
            --repo "$GITHUB_REPOSITORY" \
            "${discovery_args[@]}"

      - name: Validate repository visibility boundary
        if: ${{ matrix.repositories[0] != '' }}
        env:
          ACTIVITY_VISIBILITY_REPOSITORY: ${{ matrix.repositories[0] }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.activity-credential.outputs.token }}
          script: |
            const path = require('path')
            const { pathToFileURL } = require('url')
            const visibility = await import(pathToFileURL(path.resolve('activity/repository-visibility.mjs')).href)
            await visibility.main({ core, github, context, exec, io, getOctokit }, [process.env.REPORT_CONTROL_SETTINGS])

      - name: Download owner-scoped agentic workflow logs
        id: activity-logs
        env:
          REPORT_PUBLIC_ONLY: ${{ matrix.publicOnly == true }}
          REPORT_AIC_CACHE: ${{ runner.temp }}/cao-gh-aw-logs
          REPORT_ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/collection.sqlite
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
          REPORT_DRAIN3_WEIGHTS: ${{ runner.temp }}/cao-activity/drain3_weights.json
          REPORT_GH_AW_LOGS_EXIT_CODE: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-exit-code
          REPORT_GH_AW_LOGS_SEED_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
          REPORT_INCLUDE_CONTROL_REPOSITORY: "0"
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
          REPORT_TARGET_OWNER: ${{ matrix.owner }}
          REPORT_TARGET_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          REPORT_DEFER_ISSUE_STATUS: "1"
          REPORT_LOG_TIMEOUT: ${{ inputs.fast == true && '5' || '10' }}
          REPORT_MAX_GITHUB_API_RATE_LIMIT: ${{ steps.value-api-capacity.outputs.log-floor }}
          REPORT_MAX_STORAGE: ${{ inputs.fast == true && '100' || '1200' }}
          REPORT_RUN_LIMIT: ${{ inputs.fast == true && '10' || '10000' }}
          REPORT_RUN_WINDOW_DAYS: "30"
          REPORT_DETAIL_WINDOW_DAYS: ${{ inputs.fast == true && '1' || '7' }}
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity"
          bash activity/collect-logs.sh
          collection_exit_code="$(cat "$REPORT_GH_AW_LOGS_EXIT_CODE")"
          if [[ "$collection_exit_code" -eq 75 ]]; then
            echo "::warning::GitHub API capacity exhausted; indexing retained and downloaded runs as partial evidence."
          elif [[ "$collection_exit_code" -ne 0 ]]; then
            echo "Owner-scoped repository log collection failed" >&2
            exit "$collection_exit_code"
          fi

      - name: Enrich owner-scoped issue statuses
        if: steps.activity-logs.outputs.rate-limited != 'true' && matrix.publicOnly != true
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/collection.sqlite
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
        run: |
          node activity/cao.mjs issue-status \
            --database "$ACTIVITY_DATABASE" \
            --input-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --graphql-cost-budget 25 \
            --graphql-min-remaining 500

      - name: Retain Value evidence and publish collection health
        id: value-health
        timeout-minutes: 20
        continue-on-error: true
        env:
          REPORT_PUBLIC_ONLY: ${{ matrix.publicOnly == true }}
          ACTIVITY_ARTIFACT: ${{ matrix.artifact }}
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/collection.sqlite
          CAO_GITHUB_CREDENTIAL_ID: ${{ matrix.credentialRepository || matrix.owner }}
          REPORT_VALUE_API_RESERVE: ${{ steps.value-api-capacity.outputs.value-reserve }}
          REPORT_TARGET_REPOSITORIES_JSON: ${{ toJSON(matrix.repositories) }}
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/gh-aw-logs-shards
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/inventory-sources.json
          REPORT_VALUE_SEED_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_FAST_MODE: ${{ inputs.fast == true }}
          REPORT_RATE_LIMITED: ${{ steps.activity-logs.outputs.rate-limited }}
        run: |
          rich_seed="$REPORT_VALUE_SEED_SHARDS/workflow-values-$ACTIVITY_ARTIFACT.jsonl"
          rich_output="$REPORT_GH_AW_LOGS_SHARDS/workflow-values-$ACTIVITY_ARTIFACT.jsonl"
          if [[ -f "$rich_seed" ]]; then cp "$rich_seed" "$rich_output"; fi
          health_seed="$REPORT_VALUE_SEED_SHARDS/workflow-values-$ACTIVITY_ARTIFACT-collections.jsonl"
          health_output="$REPORT_GH_AW_LOGS_SHARDS/workflow-values-$ACTIVITY_ARTIFACT-collections.jsonl"
          if [[ -f "$health_seed" ]]; then cp "$health_seed" "$health_output"; fi
          proof_seed="$RUNNER_TEMP/cao-activity/workflow-value-workspaces/$ACTIVITY_ARTIFACT"
          proof_output="$RUNNER_TEMP/cao-activity-partial/$ACTIVITY_ARTIFACT/workflow-value-workspaces/$ACTIVITY_ARTIFACT"
          proof_staging="$RUNNER_TEMP/cao-value-proof-staging/$ACTIVITY_ARTIFACT"
          if [[ -d "$proof_seed" ]]; then
            mkdir -p "$proof_staging" "$(dirname "$proof_output")"
            cp -R "$proof_seed/." "$proof_staging/"
            mv "$proof_staging" "$proof_output"
          fi
          retained_values="$REPORT_VALUE_SEED_SHARDS/operational-values-$ACTIVITY_ARTIFACT.jsonl"
          value_output="$REPORT_GH_AW_LOGS_SHARDS/operational-values-$ACTIVITY_ARTIFACT.jsonl"
          if [[ -f "$retained_values" ]]; then
            cp "$retained_values" "$value_output"
          fi
          reason=
          if [[ "$REPORT_FAST_MODE" == "true" ]]; then reason=fast-mode; fi
          if [[ "$REPORT_PUBLIC_ONLY" == "true" ]]; then reason=public-only; fi
          if [[ "$REPORT_RATE_LIMITED" == "true" ]]; then reason=api-budget; fi
          defer_args=()
          if [[ -n "$reason" ]]; then defer_args+=(--defer "$reason"); fi
          repository_args=()
          while IFS= read -r target_repository; do
            repository_args+=(--repository "$target_repository")
          done < <(jq -r '.[]' <<< "$REPORT_TARGET_REPOSITORIES_JSON")
          node activity/workflow-values.mjs \
              --root . --policy .github/workflows/cao.json \
              --database "$ACTIVITY_DATABASE" --output "$rich_output" \
              --healthOutput "$health_output" --inventory "$REPORT_INVENTORY_SOURCES" \
              --workspace "$proof_output" "${repository_args[@]}" "${defer_args[@]}" \
              --apiBudget "$RUNNER_TEMP/cao-activity-partial/$ACTIVITY_ARTIFACT/value-api-budget.json" \
              --apiReserve "$REPORT_VALUE_API_RESERVE" \
              --localRequest "$REPORT_GH_AW_LOGS_SHARDS/workflow-value-local.json" \
              --snapshot "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Report collection-health publication failure
        if: ${{ steps.value-health.outcome == 'failure' }}
        run: echo "::warning::Value health could not be refreshed; retained evidence and its original dates are unchanged. Activity publication continues."

      - name: Recheck public-only repository boundary before publication
        if: ${{ matrix.publicOnly == true }}
        env:
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}/control-settings.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.activity-credential.outputs.token }}
          script: |
            const { pathToFileURL } = require('url')
            const visibility = await import(pathToFileURL(require('path').resolve('activity/repository-visibility.mjs')).href)
            await visibility.main({ core, github, context, exec, io, getOctokit }, [process.env.REPORT_CONTROL_SETTINGS])

      - name: Upload owner-scoped activity fragment
        env:
          ACTIVITY_FRAGMENT: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}
        run: |
          if [[ -s "$RUNNER_TEMP/cao-activity/drain3_weights.json" ]]; then
            cp "$RUNNER_TEMP/cao-activity/drain3_weights.json" "$ACTIVITY_FRAGMENT/drain3_weights.json"
          fi

      - name: Publish owner-scoped activity fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-activity-${{ matrix.artifact }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/cao-activity-partial/${{ matrix.artifact }}

  index:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.collect.result == 'success' || inputs.recycle-only == true) }}
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ needs.plan.outputs.cache-key }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up CAO activity runtime
        uses: ./.github/actions/setup-cao-runtime # zizmor: ignore[self-repository] - local action is checked out at github.workflow_sha.
        with:
          bundle: activity

      - name: Restore activity cache
        id: activity-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
            ${{ runner.temp }}/cao-activity/workflow-value-workspaces
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v5-

      - name: Restore legacy activity cache layout
        if: steps.activity-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-normalized
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
          key: ${{ needs.plan.outputs.cache-key }}
          restore-keys: |
            cao-activity-v3-

      - name: Validate restored snapshot for recycle-only maintenance
        if: ${{ inputs.recycle-only == true }}
        run: |
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-recycle-control-settings.json"
          node activity/recycle-snapshot.mjs verify \
            "$RUNNER_TEMP/cao-activity" "$RUNNER_TEMP/cao-recycle-control-settings.json"

      - name: Force recycling of restored activity cache
        if: ${{ inputs.force-recycle == true || inputs.recycle-only == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards"
          node activity/cao.mjs recycle-cache \
            --input-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards" \
            --retention-days 30 --max-bytes "$REPORT_MAX_CACHE_BYTES"
          node --input-type=module <<'EOF'
          import { pruneNormalizationCaches } from "./activity/cli/cache.mjs";
          const directories = ["runs", "records", "normalized"].map(
            (phase) => `${process.env.RUNNER_TEMP}/cao-activity/gh-aw-logs-${phase}/.payloads`
          );
          console.log(await pruneNormalizationCaches(directories, { maxBytes: 0 }));
          EOF

      - name: Download owner-scoped activity fragments
        if: ${{ inputs.recycle-only != true }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cao-activity-*
          path: ${{ runner.temp }}/cao-activity-fragments

      - name: Merge owner-scoped activity fragments
        if: ${{ inputs.recycle-only != true }}
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards"
          first_weights="$(find "$RUNNER_TEMP/cao-activity-fragments" -name drain3_weights.json -print | sort | head -n 1)"
          if [[ -n "$first_weights" ]]; then
            cp "$first_weights" "$RUNNER_TEMP/cao-activity/drain3_weights.json"
          fi
          node --input-type=module <<'EOF'
          import { mergeActivityFragments } from "./activity/cli/cache.mjs";
          console.log(await mergeActivityFragments(
            `${process.env.RUNNER_TEMP}/cao-activity-fragments`,
            `${process.env.RUNNER_TEMP}/cao-activity`
          ));
          EOF
          node activity/control-settings.mjs \
            .github/workflows/shared/control.mjs \
            .github/workflows/cao.json \
            "$RUNNER_TEMP/cao-activity/control-settings.json"

      - name: Recycle expired and oversized activity cache
        run: |
          node activity/cao.mjs recycle-cache \
            --input-dir "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards" \
            --retention-days 30 --max-bytes "$REPORT_MAX_CACHE_BYTES"

      - name: Restore previously completed local Value computation
        if: ${{ inputs.recycle-only != true }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-local-value/operational-values.jsonl
          key: cao-value-local-v1-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cao-value-local-v1-

      - name: Retain completed local values within reviewed scope
        id: local-value-import
        if: ${{ inputs.recycle-only != true }}
        timeout-minutes: 1
        continue-on-error: true
        run: |
          node activity/local-values.mjs retain --policy .github/workflows/cao.json \
            --input "$RUNNER_TEMP/cao-local-value/operational-values.jsonl" \
            --output "$RUNNER_TEMP/cao-activity/gh-aw-logs-shards/operational-values-local.jsonl"

      - name: Report optional local Value import failure
        if: ${{ steps.local-value-import.outcome == 'failure' }}
        run: echo "::warning::Completed local Value results could not be imported; accepted evidence is unchanged. Activity publication continues."

      - name: Rebuild recycled snapshot projection from retained evidence
        if: ${{ inputs.recycle-only == true }}
        run: node activity/recycle-snapshot.mjs reset "$RUNNER_TEMP/cao-activity"

      - name: Generate bounded agent summary
        run: |
          node activity/agent-summary.mjs \
            "$RUNNER_TEMP/cao-activity/inventory-sources.json" \
            "$RUNNER_TEMP/cao-activity/agent-summary.json"

      - name: Fetch repository memory refs into a separate checkout
        if: ${{ inputs.recycle-only != true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: cao-memory-source
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Collect campaign repository memory
        if: ${{ inputs.recycle-only != true }}
        env:
          REPORT_INVENTORY_SOURCES: ${{ runner.temp }}/cao-activity/inventory-sources.json
          REPORT_REPOSITORY_MEMORY: ${{ runner.temp }}/cao-activity/memory
        run: |
          node activity/repository-memory.mjs \
            "$GITHUB_WORKSPACE/cao-memory-source" \
            "$REPORT_INVENTORY_SOURCES" \
            "$REPORT_REPOSITORY_MEMORY"

      - name: Generate phased activity shards
        env:
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --max-bytes 1048576 \
            --max-cache-bytes "$REPORT_MAX_NORMALIZED_CACHE_BYTES" \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json"

      - name: Ingest activity database
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs ingest-jsonl \
            --database "$ACTIVITY_DATABASE" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --retention-days 7 \
            --run-retention-days 30

      - name: Compute package problems
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: node activity/cao.mjs cluster-problems --database "$ACTIVITY_DATABASE" --root .

      - name: Repair activity database and apply retention
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
        run: node activity/cao.mjs repair-database --database "$ACTIVITY_DATABASE" --ttl-days 7 --run-ttl-days 30

      - name: Hash activity payloads
        env:
          ACTIVITY_DATABASE: ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
          REPORT_GH_AW_LOGS_SHARDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
          REPORT_GH_AW_LOGS_RUNS: ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
          REPORT_GH_AW_LOGS_RECORDS: ${{ runner.temp }}/cao-activity/gh-aw-logs-records
        run: |
          node activity/cao.mjs hash-payloads \
            --database "$ACTIVITY_DATABASE" \
            --shard-dir "$REPORT_GH_AW_LOGS_SHARDS" \
            --runs-dir "$REPORT_GH_AW_LOGS_RUNS" \
            --records-dir "$REPORT_GH_AW_LOGS_RECORDS" \
            --max-bytes 1048576 \
            --inventory "$RUNNER_TEMP/cao-activity/inventory-sources.json" \
            --max-cache-bytes "$REPORT_MAX_NORMALIZED_CACHE_BYTES" \
            --output "$RUNNER_TEMP/cao-activity/payload-hashes.json"

      - name: Upload activity snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cao-activity-index
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
            ${{ runner.temp }}/cao-activity/workflow-value-workspaces

  cache:
    needs: index
    if: ${{ !cancelled() && needs.index.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: none
    steps:
      - name: Download activity snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-activity-index
          path: ${{ runner.temp }}/cao-activity

      - name: Verify activity snapshot
        run: |
          snapshot_root="$RUNNER_TEMP/cao-activity"
          mkdir -p "$snapshot_root/gh-aw-logs-shards" "$snapshot_root/gh-aw-logs-runs" "$snapshot_root/gh-aw-logs-records"
          missing=0
          for file in gh-aw-logs.sqlite payload-hashes.json control-settings.json inventory-sources.json agent-summary.json; do
            [[ -s "$snapshot_root/$file" ]] || { echo "Activity snapshot file is missing or empty: $file" >&2; missing=1; }
          done
          [[ -s "$snapshot_root/memory/manifest.json" ]] || { echo "Activity snapshot file is missing or empty: memory/manifest.json" >&2; missing=1; }
          if grep -qs '"kind":"record"' "$snapshot_root"/gh-aw-logs-runs/*.jsonl && [[ ! -s "$snapshot_root/drain3_weights.json" ]]; then
            echo "Activity snapshot file is missing or empty: drain3_weights.json" >&2
            missing=1
          fi
          for phase in shards runs records; do
            find "$snapshot_root/gh-aw-logs-$phase" -maxdepth 1 -type f -name '*.jsonl' -print -quit | grep -q . \
              || { echo "Activity snapshot contains no $phase shards" >&2; missing=1; }
          done
          [[ "$missing" -eq 0 ]] || { echo "Refusing to publish an incomplete activity cache" >&2; exit 1; }

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cao-activity/gh-aw-logs.sqlite
            ${{ runner.temp }}/cao-activity/gh-aw-logs-shards
            ${{ runner.temp }}/cao-activity/gh-aw-logs-runs
            ${{ runner.temp }}/cao-activity/gh-aw-logs-records
            ${{ runner.temp }}/cao-activity/payload-hashes.json
            ${{ runner.temp }}/cao-activity/control-settings.json
            ${{ runner.temp }}/cao-activity/inventory-sources.json
            ${{ runner.temp }}/cao-activity/agent-summary.json
            ${{ runner.temp }}/cao-activity/drain3_weights.json
            ${{ runner.temp }}/cao-activity/memory
            ${{ runner.temp }}/cao-activity/workflow-value-workspaces
          key: ${{ needs.index.outputs.cache-key }}

  notify-failure:
    needs: [plan, collect, index, cache]
    if: ${{ always() && inputs.recycle-only != true && (needs.plan.result == 'failure' || needs.collect.result == 'failure' || needs.index.result == 'failure' || needs.cache.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify current repository about CAO Activity failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[cao] CAO Activity workflow failure'
            const legacyTitle = 'CAO Activity workflow failure'
            const jobs = {
              CAO_ACTIVITY_PLAN_FAILED: ['${{ needs.plan.result }}', 'The activity authentication plan failed.'],
              CAO_ACTIVITY_COLLECTION_FAILED: ['${{ needs.collect.result }}', 'One or more independently authenticated collection jobs failed.'],
              CAO_ACTIVITY_INDEX_FAILED: ['${{ needs.index.result }}', 'The activity indexing job failed.'],
              CAO_ACTIVITY_CACHE_FAILED: ['${{ needs.cache.result }}', 'The activity cache publication job failed.'],
            }
            const failures = Object.entries(jobs)
              .filter(([, [result]]) => result === 'failure')
              .map(([code, [result, message]]) => ({ code, result, message }))
            if (failures.length === 0) return
            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com'
            const workflowSha = process.env.GITHUB_WORKFLOW_SHA
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const debugSkillUrl = `${serverUrl}/githubnext/gh-cao/blob/main/skills/debug-cao/SKILL.md`
            const rows = failures.map(({ code, message, result }) => `| \`${code}\` | ${message} | ${result} |`).join('\n')
            const body = [
              'The CAO Activity workflow failed in this repository.',
              '', '## Failure codes', '', '| Code | Message | Job result |', '| --- | --- | --- |', rows,
              '', '## Suggested next step', '',
              'Assign this issue to an agent and ask it to fix the workflow failure using the failure code(s) above.',
              '', '---',
              `Ask an agent to follow the [\`debug-cao\` skill](${debugSkillUrl}) and diagnose workflow commit \`${workflowSha}\`.`,
              '', `> Generated by [CAO Activity](${runUrl})`,
            ].join('\n')
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
            const existingIssue = openIssues.find((issue) => !issue.pull_request && [title, legacyTitle].includes(issue.title))
            if (existingIssue) {
              if (existingIssue.title !== title) await github.rest.issues.update({ ...context.repo, issue_number: existingIssue.number, title })
              await github.rest.issues.createComment({ ...context.repo, issue_number: existingIssue.number, body })
              return
            }
            await github.rest.issues.create({ ...context.repo, title, body })
