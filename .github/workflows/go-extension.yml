name: Go Extension CI

on:
  pull_request:
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - server/cmd/cao-dashboard/**
      - server/internal/server/**
      - server/internal/simulator/**
      - server/azure/**
      - server/Dockerfile
      - server/go.mod
      - server/go.sum
      - aw.yml
      - dashboard/catalog.go
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - tests/unit/workflow-contract-ci-triggers.test.mjs
      - tests/integration/gh-extension-installation.test.mjs

      - dashboard/site/src/agent/**
      - dashboard/site/src/data/**
      - dashboard/site/src/semantic-view-prompt.js
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/go-extension.yml
      - .github/workflows/cao.json
      - .github/actions/setup-gh-aw/**
      - .golangci.yml
      - cmd/**
      - internal/**
      - server/cmd/cao-dashboard/**
      - server/internal/server/**
      - server/internal/simulator/**
      - server/azure/**
      - server/Dockerfile
      - server/go.mod
      - server/go.sum
      - aw.yml
      - dashboard/catalog.go
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - Makefile
      - scripts/build-release.sh
      - tests/unit/build-release.test.mjs
      - tests/unit/workflow-contract-ci-triggers.test.mjs
      - tests/integration/gh-extension-installation.test.mjs

      - dashboard/site/src/agent/**
      - dashboard/site/src/data/**
      - dashboard/site/src/semantic-view-prompt.js
      - dashboard/site/dashboard.json
      - dashboard/site/dashboard-fragments/**
      - dashboard/report/bundle-dashboards.mjs

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-extension-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension-quality:
    name: Format, lint, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Install official Bicep validator for topology samples
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64 \
            --output "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' \
            '0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5' \
            "$RUNNER_TEMP/bicep" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/bicep"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check formatting
        shell: bash
        run: |
          golangci-lint fmt --diff ./cmd/... ./internal/... ./dashboard | tee "$RUNNER_TEMP/go-extension-fmt.diff"
          test ! -s "$RUNNER_TEMP/go-extension-fmt.diff"
      - name: Lint
        run: golangci-lint run ./cmd/... ./internal/... ./dashboard
      - name: Check shared local query engine
        working-directory: internal/dashboardquery
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install JavaScript parity-oracle dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check extension
        run: make check
      - name: Check GitHub CLI release installation
        if: github.event_name != 'pull_request'
        run: node --test tests/integration/gh-extension-installation.test.mjs
      - name: Check standalone execution without Node.js
        run: |
          binary="$PWD/gh-cao"
          cd "$RUNNER_TEMP"
          PATH="" "$binary" version
          PATH="" "$binary" pages --json > /dev/null
          PATH="" "$binary" queries --json > /dev/null
          PATH="" "$binary" query-info campaign-runs --json > /dev/null
          if CAO_POSTGRES_URL="" PATH="" "$binary" query --collection runs; then
            echo "Database-backed queries must require PostgreSQL" >&2
            exit 1
          fi
      - name: Smoke test extension
        run: |
          ./gh-cao --help
          ./gh-cao version
          ./gh-cao doctor --help
          ./gh-cao setup --help
          ./gh-cao setup auth --help
          ./gh-cao setup auth github-app --help
          ./gh-cao setup auth enterprise-app --help
          ./gh-cao setup auth token --help
          ./gh-cao pages --json > /dev/null

  extension-setup-simulator:
    name: Setup against local GitHub and Azure simulators
    # Keep the full external-tool topology matrix off the PR critical path.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: cao
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install policy-pinned gh-aw prerequisite
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run offline setup integration tests
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          GH_ENTERPRISE_TOKEN: ""
          GITHUB_ENTERPRISE_TOKEN: ""
        run: npm run test:integration:setup
      - name: Prepare offline Azure simulation prerequisites
        run: |
          go mod download
          go -C server mod download
          docker pull mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
      - name: Run Azure setup with official Azurite and local control-plane simulation
        env:
          POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          GH_ENTERPRISE_TOKEN: ""
          GITHUB_ENTERPRISE_TOKEN: ""
        run: |
          npm run test:integration:setup-azure
          npm run test:integration:azure-install-journey

  extension-authtests:
    name: Doctor authenticated integration tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install policy-pinned gh-aw
        uses: ./.github/actions/setup-gh-aw # zizmor: ignore[self-repository] - Local actions use the syntax accepted by GitHub Actions and actionlint.
      - name: Run authenticated doctor integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: make authtests
