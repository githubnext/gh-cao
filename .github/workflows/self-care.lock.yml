          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"self-care-accessibility-checker\",\"self-care-agent-discoverability\",\"self-care-cli-consistency\",\"self-care-code-improvement\",\"self-care-dashboard-data-schema\",\"self-care-dashboard-debug-logging\",\"self-care-dashboard-performance\",\"self-care-data-acquisition-audit\",\"self-care-dashboard-language-refactor\",\"self-care-dashboard-review\",\"self-care-docs-build-time-investigator\",\"self-care-docs-maintainer\",\"self-care-documentation-discoverability\",\"self-care-glossary\",\"self-care-open-source-failures\",\"self-care-pages-health\",\"self-care-primer-brand-checker\",\"self-care-reactive-ui-expert\",\"self-care-server-go-logging\",\"self-care-server-soc2\",\"self-care-specs-maintainer\"],\"max\":21,\"workflow_files\":{\"self-care-accessibility-checker\":\".lock.yml\",\"self-care-agent-discoverability\":\".lock.yml\",\"self-care-cli-consistency\":\".lock.yml\",\"self-care-code-improvement\":\".lock.yml\",\"self-care-dashboard-data-schema\":\".lock.yml\",\"self-care-dashboard-debug-logging\":\".lock.yml\",\"self-care-dashboard-language-refactor\":\".lock.yml\",\"self-care-dashboard-performance\":\".lock.yml\",\"self-care-dashboard-review\":\".lock.yml\",\"self-care-data-acquisition-audit\":\".lock.yml\",\"self-care-docs-build-time-investigator\":\".lock.yml\",\"self-care-docs-maintainer\":\".lock.yml\",\"self-care-documentation-discoverability\":\".lock.yml\",\"self-care-glossary\":\".lock.yml\",\"self-care-open-source-failures\":\".lock.yml\",\"self-care-pages-health\":\".lock.yml\",\"self-care-primer-brand-checker\":\".lock.yml\",\"self-care-reactive-ui-expert\":\".lock.yml\",\"self-care-server-go-logging\":\".lock.yml\",\"self-care-server-soc2\":\".lock.yml\",\"self-care-specs-maintainer\":\".lock.yml\"},\"workflows\":[\"self-care-accessibility-checker\",\"self-care-agent-discoverability\",\"self-care-cli-consistency\",\"self-care-code-improvement\",\"self-care-dashboard-data-schema\",\"self-care-dashboard-debug-logging\",\"self-care-dashboard-performance\",\"self-care-data-acquisition-audit\",\"self-care-dashboard-language-refactor\",\"self-care-dashboard-review\",\"self-care-docs-build-time-investigator\",\"self-care-docs-maintainer\",\"self-care-documentation-discoverability\",\"self-care-glossary\",\"self-care-open-source-failures\",\"self-care-pages-health\",\"self-care-primer-brand-checker\",\"self-care-reactive-ui-expert\",\"self-care-server-go-logging\",\"self-care-server-soc2\",\"self-care-specs-maintainer\"]},\"noop\":{\"max\":2,\"report-as-issue\":\"false\"},\"report_incomplete\":{},\"report_missing_data\":{},\"report_missing_tool\":{}}"
          GH_AW_SAFE_OUTPUTS_STAGED: ${{ inputs.safe_output_mode == 'debug' }}
          GH_AW_GITHUB_TOKEN_SOURCE: ${{ steps.safe-outputs-app-token.outputs.token != '' && 'app' || 'unknown' }}
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token || env.CAO_ROLE == 'orchestrator' && ((inputs.safe_output_mode || 'review') == 'review' && (inputs.safe_output_repo || github.repository) || inputs.target_repo || github.repository) == github.repository && github.token || vars.GH_AW_GITHUB_AUTH_MODE == 'pat' && secrets[fromJSON(vars.GH_AW_GITHUB_WRITE_PAT_REPOSITORIES || '{}')[(inputs.safe_output_mode || 'review') == 'review' && (inputs.safe_output_repo || github.repository) || inputs.target_repo || github.repository]] || vars.GH_AW_GITHUB_AUTH_MODE == '' && secrets.GH_AW_GITHUB_WRITE_PAT || vars.GH_AW_GITHUB_AUTH_MODE == '' && secrets.GH_AW_GITHUB_TOKEN || (vars.GH_AW_GITHUB_AUTH_MODE == '' || vars.GH_AW_GITHUB_AUTH_MODE == 'workflow-token') && secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit, process.env.GH_AW_GITHUB_TOKEN_SOURCE);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
