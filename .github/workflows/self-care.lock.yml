name: "SelfCare"
on:
  # permissions: # Permissions applied to pre-activation job
  # actions: read
  # contents: read
  schedule:
    - cron: "2/20 * * * *"  # Friendly format: every 20 minutes (scattered)
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      central_repo:
        type: string
      control_plane_run_url:
        type: string
      correlation_id:
        type: string
      max_repos:
        default: 1
        type: number
      rollout_percent:
        default: 100
        type: number
      safe_output_mode:
        default: review
        options:
          - review
          - live
        type: choice
      safe_output_repo:
        type: string
      target_repo:
        type: string

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

run-name: ${{ github.event_name == 'schedule' && 'SelfCare · scheduled' || format('SelfCare · {0} · {1}', inputs.target_repo || github.repository, inputs.safe_output_mode || 'review') }}

env:
  CAO_CAMPAIGN: self-care
  CAO_DEFAULT_TARGET_REPOSITORY: ${{ github.repository }}
  CAO_ROLE: orchestrator
  CAO_WORKER: __none__
  CAO_WORKFLOW: __none__
  GH_AW_SAFE_OUTPUT_MODE: ${{ inputs.safe_output_mode || 'review' }}
  REVIEW_OUTPUT_REPO: ${{ inputs.safe_output_repo || github.repository }}
  SAFE_OUTPUT_REPO: ${{ (inputs.safe_output_mode || 'review') == 'review' && (inputs.safe_output_repo || github.repository) || '' }}
  TARGET_REPO: ${{ inputs.target_repo || '' }}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
