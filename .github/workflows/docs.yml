name: Documentation Pages

on:
  workflow_dispatch:
  schedule:
    # Refresh synthetic dates; never wait for operational collection.
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - .github/workflows/shared/**
      - "*/aw.yml"
      - astro.config.mjs
      - aw.yml
      - docs/**
      - dashboard/site/**
      - dashboard/report/**

      - scripts/simulate-dashboard-pages.mjs
      - package.json
      - package-lock.json
      - public/**

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci && npm --prefix dashboard/site ci --omit=dev --ignore-scripts
      - name: Build documentation
        env:
          PUBLIC_PAGES_BUILD_COMMIT: ${{ github.sha }}
        run: npm run docs:build
      - name: Build synthetic enterprise demo
        run: |
          npm run dashboard:pages:build
          cp -R .tmp/dashboard-pages dist/cao
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
