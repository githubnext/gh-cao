name: Go Dashboard Server CI

on:
  pull_request:
    paths:
      - .github/workflows/cgo.yml
      - internal/dashboardquery/**
      - internal/cli/**
      - go.mod
      - go.sum
      - activity/**
      - dashboard/site/**
      - package.json
      - package-lock.json
      - scripts/run-daily-run-counts-conformance.mjs
      - tests/contracts/daily-run-counts.json
      - tests/contracts/statistical-sampling.json
      - tests/unit/dashboard-statistical-conformance.test.mjs
      - specs/tla/StatisticalSampling.*
      - specs/dashboard-data.md
      - docs/dashboard-language-specification.md
      - tests/unit/activity-daily-run-counts.test.mjs
      - tests/unit/dashboard-daily-run-counts-conformance.test.mjs
      - tests/integration/activity-actions-runtime.test.mjs
      - tests/helpers/actions-runtime/**
      - .github/workflows/cao-activity.yml
      - .github/actions/setup-cao-runtime/**
      - server/**
      - tests/fixtures/company-stress/**
      - scripts/company-stress.mjs
      - "!dashboard/site/**/*.md"
      - "!server/**/*.md"
  push:
    branches: [main]
    paths:
      - .github/workflows/cgo.yml
      - internal/dashboardquery/**
      - internal/cli/**
      - go.mod
      - go.sum
      - activity/**
      - dashboard/site/**
      - server/**
      - tests/fixtures/company-stress/**
      - scripts/company-stress.mjs
      - scripts/test-dashboard-backfill.sh
      - scripts/run-daily-run-counts-conformance.mjs
      - package.json
      - package-lock.json
      - tests/contracts/daily-run-counts.json
      - tests/contracts/statistical-sampling.json
      - tests/unit/dashboard-statistical-conformance.test.mjs
      - specs/tla/StatisticalSampling.*
      - specs/dashboard-data.md
      - docs/dashboard-language-specification.md
      - tests/unit/activity-daily-run-counts.test.mjs
      - tests/unit/dashboard-daily-run-counts-conformance.test.mjs
      - tests/integration/activity-actions-runtime.test.mjs
      - tests/helpers/actions-runtime/**
      - .github/workflows/cao-activity.yml
      - .github/actions/setup-cao-runtime/**
      - tests/e2e/dashboard-server.spec.mjs
      - tests/playwright/configs/dashboard-server.config.mjs
      - "!dashboard/site/**/*.md"
      - "!server/**/*.md"

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  daily-run-counts-conformance:
    name: Daily run-count conformance
    # Full cross-backend and TLC checks run after merge or on explicit invocation.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao_daily_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d cao_daily_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/site/package-lock.json
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache: false
      - name: Install dependencies
        run: npm ci && npm ci --prefix dashboard/site
      - name: Install native Chromium
        working-directory: dashboard/site
        run: npx playwright install --with-deps chromium
      - name: Pull isolated Activity runner image
        run: docker pull node:24-bookworm
      - name: Verify the implemented daily aggregate contract across backends
        env:
          POSTGRES_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cao_daily_test?sslmode=disable
        run: npm run test:conformance:daily-run-counts
      - name: Fetch pinned TLC model checker
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$TLA2TOOLS_JAR"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum --check
      - name: Verify statistical sampling and persisted bundle conformance
        env:
          POSTGRES_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cao_daily_test?sslmode=disable
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
        run: npm run test:conformance:statistical-sampling

  windows-local-server:
    name: Windows local development server
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: |
            server/go.sum
            internal/dashboardquery/go.sum
      - name: Build native Windows development server
        run: go -C server build ./cmd/cao-dashboard
      - name: Run local SQLite server and query its HTTP API
        run: >-
          go -C server test ./cmd/cao-dashboard
          -run '^(TestServeSQLite.*|TestServePostgresRequiresExplicitSelection|TestDownloadSQLite.*)$'
          -count=1 -timeout=3m -v
      - name: Verify local snapshot paths and read-only queries
        run: go -C server test ./internal/sqlitex -count=1 -timeout=3m -v
      - name: Verify evidence locking and cancellation
        run: >-
          go -C server test ./internal/collect
          -run '^TestEvidenceLock' -count=1 -timeout=1m -v

  server-quality:
    name: Go format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: |
            server/go.sum
            internal/dashboardquery/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Check formatting
        working-directory: server
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: server
        run: golangci-lint run ./...
      - name: Unit tests
        env:
          GO_TEST_MODE: ${{ github.event_name == 'pull_request' && '-short' || '-count=1' }}
        run: go -C server test "$GO_TEST_MODE" ./...
      - name: Local Actions, OIDC, admission, and webhook gateway integration
        if: github.event_name != 'pull_request'
        run: >-
          go -C server test -race ./internal/simulator ./internal/admission
          ./internal/webhookgateway ./cmd/cao-webhook-gateway
          -run '^(TestLocalActions|TestSpecLocalHost|TestGatewayAPI|TestIssueServiceSimulator($|HTTP|GatewaySQLite)|TestGitHubSimulator(Gateway|Discovery)SQLite)' -count=1 -timeout=2m -v
      - name: Check shared local query engine
        working-directory: internal/dashboardquery
        run: |
          golangci-lint fmt --diff
          golangci-lint run ./...
          go test ./...

  actions-simulator-postgres:
    name: Local Actions and webhook PostgreSQL integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao_actions_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d cao_actions_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CAO_ACTIONS_SIMULATOR_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - name: Exercise local Actions and gateway with durable PostgreSQL state
        env:
          POSTGRES_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cao_actions_test?sslmode=disable
        run: >-
          go -C server test -race ./internal/admission ./internal/webhookgateway
          -run '^(TestLocalActionsPostgresIntegration|TestIssueServiceSimulatorGatewayPostgres|TestGitHubSimulator(Gateway|Discovery)Postgres)$' -count=1 -timeout=2m -v

  server-backfill:
    name: Postgres backfill and OpenObserve integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - name: Run isolated backfill services and integration tests
        run: bash scripts/test-dashboard-backfill.sh
      - name: Upload backfill results and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-server-backfill
          path: .tmp/go-backfill/
          if-no-files-found: error
          retention-days: 14

  server-spec:
    name: TypeSpec API contract and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/spec/package-lock.json
      - name: Install spec dependencies
        working-directory: server/spec
        run: npm ci
      - name: Compile and verify API contract
        working-directory: server/spec
        run: npm run check

  server-stress:
    name: Go rate-limit stress and profiles
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cao"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CAO_STRESS_REDIS_URL: redis://127.0.0.1:6379/0
      POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      CAO_STRESS_REPORT_DIR: ${{ github.workspace }}/.tmp/go-stress
      CAO_STRESS_MAX_P95_MS: "250"
      CAO_STRESS_MIN_RPS: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - name: Run rate-limit stress harness with profiling
        working-directory: server
        run: |
          set -o pipefail
          mkdir -p "$CAO_STRESS_REPORT_DIR"
          go test ./internal/server \
            -run '^TestStress' -bench '^BenchmarkStress' -benchmem -benchtime=2000x \
            -count=1 -timeout=10m -v \
            -cpuprofile=cpu.pprof -memprofile=mem.pprof \
            -blockprofile=block.pprof -mutexprofile=mutex.pprof -trace=trace.out \
            -outputdir="$CAO_STRESS_REPORT_DIR" 2>&1 | tee "$CAO_STRESS_REPORT_DIR/go-test.txt"
      - name: Summarize profiles and thresholds
        if: always()
        working-directory: server
        run: |
          dir="$CAO_STRESS_REPORT_DIR"
          [ -f "$dir/go-test.txt" ] && grep -E '^(goos|goarch|pkg|cpu|Benchmark)' "$dir/go-test.txt" > "$dir/bench.txt" || true
          [ -f "$dir/cpu.pprof" ] && go tool pprof -top -nodecount=60 "$dir/cpu.pprof" > "$dir/cpu-top.txt" 2>&1 || true
          [ -f "$dir/mem.pprof" ] && go tool pprof -top -nodecount=60 -sample_index=alloc_space "$dir/mem.pprof" > "$dir/mem-alloc-top.txt" 2>&1 || true
          [ -f "$dir/block.pprof" ] && go tool pprof -top -nodecount=40 "$dir/block.pprof" > "$dir/block-top.txt" 2>&1 || true
          [ -f "$dir/mutex.pprof" ] && go tool pprof -top -nodecount=40 "$dir/mutex.pprof" > "$dir/mutex-top.txt" 2>&1 || true
          {
            echo "## Go server rate-limit stress"
            echo
            echo "| Scenario | Requests | req/s | p50 ms | p95 ms | p99 ms | Statuses | Upstream (requests/metered/rate-limited) |"
            echo "|---|---:|---:|---:|---:|---:|---|---|"
            for report in "$dir"/*.json; do
              [ -f "$report" ] || continue
              jq -r '"| \(.scenario) | \(.requests) | \(.requestsPerSecond | floor) | \(.latencyMs.p50) | \(.latencyMs.p95) | \(.latencyMs.p99) | \(.statuses | to_entries | map("\(.key): \(.value)") | join(", ")) | \(.upstream.requests)/\(.upstream.metered)/\(.upstream.rateLimited) |"' "$report"
            done
            echo
            echo "Thresholds: p95 <= ${CAO_STRESS_MAX_P95_MS} ms, throughput >= ${CAO_STRESS_MIN_RPS} req/s."
            if [ -s "$dir/bench.txt" ]; then
              echo
              echo '```'
              cat "$dir/bench.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stress reports and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-server-stress-profiles
          path: .tmp/go-stress/
          if-no-files-found: warn
          retention-days: 14

  redis-dashboard-integration:
    name: Postgres dashboard integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cao
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cao"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      CAO_SIMULATOR_REDIS_URL: redis://127.0.0.1:6379/0
      POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      CAO_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      CAO_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/cao?sslmode=disable
      CAO_OPERATIONAL_NAMESPACE: dashboard-server-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate dashboard access token
        run: |
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "DASHBOARD_SERVER_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.27.3
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix dashboard/site ci
          npm --prefix server/spec ci
      - name: Go tests with Redis and Postgres
        # Memory-pressure tests measure the whole Redis node, not one namespace.
        # Daily partition fixtures make a single package exceed Go's 10m budget.
        # Partition unique test names, including example and fuzz seed coverage.
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          pattern=$(go -C server test -p 1 -list '^(Test|Example|Fuzz)' ./... |
            awk -v shard="$TEST_SHARD" -v count="$TEST_SHARD_COUNT" '
              /^(Test|Example|Fuzz)[[:alnum:]_]*$/ && !seen[$0]++ {
                if (ordinal++ % count == shard) {
                  printf "%s%s", separator, $0
                  separator = "|"
                }
              }')
          test -n "$pattern"
          go -C server test -p 1 -run "^($pattern)$" ./...
      - name: Build dashboard and server
        if: matrix.shard == 0
        run: |
          npm run dashboard:server:build
          mkdir -p .tmp
          go -C server build -o ../.tmp/cao-dashboard ./cmd/cao-dashboard
      - name: Bootstrap dashboard integration storage
        if: matrix.shard == 0
        env:
          CAO_DATABASE_ADMIN_URL: ${{ env.CAO_POSTGRES_URL }}
        run: |
          .tmp/cao-dashboard database bootstrap --store canonical --namespace "$CAO_OPERATIONAL_NAMESPACE"
          .tmp/cao-dashboard database bootstrap --store operational --namespace "$CAO_OPERATIONAL_NAMESPACE"
      - name: Install Chromium
        if: matrix.shard == 0
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Verify deployed shards populate dashboard views
        if: matrix.shard == 0
        env:
          DASHBOARD_SERVER_COMMAND: >-
            ${{ github.workspace }}/.tmp/cao-dashboard serve
            --redis-namespace "$CAO_OPERATIONAL_NAMESPACE"
            --source "$DASHBOARD_SERVER_SOURCE"
            --access-token ${{ env.DASHBOARD_SERVER_ACCESS_TOKEN }}
            --site ${{ github.workspace }}/dashboard/site/dist
            --dashboard-queries ${{ github.workspace }}/dashboard/site/dashboard.json
            --database-queries ${{ github.workspace }}/dashboard/site/src/data/queries/database.json
        run: npm run test:e2e:dashboard-server
      - name: Upload integration traces
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-server-integration
          path: test-results/dashboard-server/
          if-no-files-found: warn
          retention-days: 14

  redis-dashboard-comment:
    name: Report Go Postgres dashboard page results
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.redis-dashboard-integration.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: redis-dashboard-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download dashboard integration results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-server-integration
          path: dashboard-server-results
      - name: Comment with Go Postgres dashboard page results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INTEGRATION_RESULT: ${{ needs.redis-dashboard-integration.result }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- go-redis-dashboard-page-results -->'
            const summaryPath = 'dashboard-server-results/summary.md'
            const passed = process.env.INTEGRATION_RESULT === 'success'
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim().slice(0, 55000)
              : 'No per-page report was produced; the integration job did not complete the page checks.'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              `**Go Postgres dashboard integration: ${passed ? 'PASSED' : 'FAILED'}**`,
              '',
              '<details><summary><b>Per-page results</b></summary>',
              '',
              summary,
              '',
              '</details>',
              '',
              `[View the workflow run and integration artifact](${runUrl}).`,
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              })
            }
