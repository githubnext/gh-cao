language-version: "0.1.0"
dashboard:
  id: secret-leak-review-attainment
  title: Secret-leak review attainment
  defaults:
    scope:
      repositories:
        - githubnext/gh-cao
      workflows:
        - .github/workflows/secret-leak-review.yml
    time:
      range: 30d
  units:
    ratio:
      name: Attainment ratio
      symbol: ratio
      significant: 0.01
      format: number
  queries:
    - name: eligible-secret-leak-detections
      subject: Select high-severity secret-leak threat detections that create bounded review opportunities.
      objective: Keep activation evidence specific to the synthetic workflow's secret-leak review task.
      acceptance: Every output row is a high-severity threat-detection-secret-leak finding with its canonical evidence unchanged.
      from: security-findings
      filter:
        predicates:
          - field: smell-id
            equals: threat-detection-secret-leak
          - field: smell-severity
            equals: high
  pages:
    - id: secret-leak-review-attainment
      kind: custom
      title: Secret-leak review attainment
      description: Shows bounded secret-leak detections, workflow execution, issue safe-output outcomes, and native review attainment without equating run success with accepted evidence.
      views:
        - id: execution-conclusions
          subject: Execution conclusions for the secret-leak review workflow.
          objective: Show whether bounded review executions complete successfully or require investigation.
          acceptance: Every slice counts only runs of the scoped workflow in the selected horizon and preserves native run conclusions.
          title: Execution conclusions
          data:
            source: runs
            filters:
              workflow: .github/workflows/secret-leak-review.yml
          mark: chart
          chart: pie
          layout: half
          disclosure: essential
          encoding:
            x:
              field: run-conclusion
              type: ordinal
              title: Conclusion
            y:
              field: run
              type: quantitative
              aggregate: distinct-count
              title: Runs
        - id: secret-leak-detections
          subject: High-severity secret-leak threat detections that activate bounded review opportunities.
          objective: Let security operators inspect each eligible detection and its remediation guidance without exposing secret payloads.
          acceptance: Only high-severity threat-detection-secret-leak findings from the scoped workflow appear, newest first, with retained evidence and run provenance.
          title: Eligible secret-leak detections
          data:
            source: eligible-secret-leak-detections
            filters:
              workflow: .github/workflows/secret-leak-review.yml
            order-by:
              - field: observed-at
                direction: desc
            limit: 30
          mark: table
          controls: interactive
          layout: full
          disclosure: essential
          empty-message: No eligible secret-leak detections were observed in the selected horizon; unavailable evidence must be inspected separately.
          encoding:
            href:
              field: evidence-link
              type: nominal
            columns:
              - field: smell-summary
                type: nominal
                title: Detection
              - field: smell-evidence
                type: nominal
                title: Evidence summary
              - field: smell-recommendation
                type: nominal
                title: Recommended action
              - field: run
                type: nominal
                title: Run
                display: run-link
              - field: observed-at
                type: temporal
                title: Observed
        - id: issue-outcomes
          subject: Issue safe-output outcomes emitted for secret-leak review opportunities.
          objective: Expose accepted effects and pending, ignored, or rejected exceptions that need operator attention.
          acceptance: The queue shows only issue outcomes from the scoped workflow, newest first, with outcome state, run conclusion, and issue navigation.
          data:
            source: outcomes
            filters:
              workflow: .github/workflows/secret-leak-review.yml
              outcome-category: issue
            order-by:
              - field: observed-at
                direction: desc
              - field: outcome-number
                direction: asc
            limit: 30
          mark: table
          controls: interactive
          layout: full
          disclosure: supplemental
          empty-message: No issue safe-output outcomes were observed for the scoped workflow.
          encoding:
            href:
              field: issue-link
              type: nominal
            columns:
              - field: outcome-title
                type: nominal
                title: Issue
                display: outcome-link
              - field: outcome-number
                type: quantitative
                title: Number
              - field: outcome-state
                type: ordinal
                title: Outcome
                display: status
              - field: run-conclusion
                type: ordinal
                title: Run conclusion
                display: status
              - field: observed-at
                type: temporal
                title: Observed
        - id: attainment-observations
          subject: Native secret-leak review attainment observations published by gh-aw.
          objective: Show exact attained values over time without averaging, normalization, baseline inference, or null-to-zero coercion.
          acceptance: Every point preserves the native secret-leak-review-attainment ratio for the scoped workflow and remains bounded to observed evidence.
          title: Review acknowledgement attainment
          data:
            source: operational-values
            filters:
              workflow: .github/workflows/secret-leak-review.yml
              operational-value-definition: secret-leak-review-attainment
            order-by:
              - field: observed-at
                direction: asc
            limit: 100
          mark: chart
          chart: dot
          layout: half
          disclosure: essential
          encoding:
            x:
              field: observed-at
              type: temporal
              title: Observed
            y:
              field: operational-value
              type: quantitative
              title: Attainment
              unit: ratio
            href:
              field: run-link
              type: nominal
