name: Central Agentic Ops
icon: ":workflow:"
description: Central agentic workflow control plane for reusable campaigns at the organization level
min-version: v0.93.4
experimental: true
includes:
  - activity/aw.yml
  - dashboard/aw.yml
  - .github/workflows/cao-validate.yml
skills:
  - skills/agentic-workflows
  - skills/setup-cao
  - skills/add-cao-campaign
  - skills/create-cao-campaign
  - skills/debug-cao
  - skills/analyze-cao
  - skills/cao-cli
agents:
  - .github/agents/agentic-workflows.md
resources:
  - source: .github/workflows/shared/control.mjs
    destination: .github/workflows/shared/control.mjs
  - source: .github/workflows/shared/inventory-credentials.mjs
    destination: .github/workflows/shared/inventory-credentials.mjs
  - source: .github/workflows/shared/policy.mjs
    destination: .github/workflows/shared/policy.mjs
  - source: .github/workflows/shared/authority.mjs
    destination: .github/workflows/shared/authority.mjs
  - source: .github/workflows/shared/operations.mjs
    destination: .github/workflows/shared/operations.mjs
  - source: .github/workflows/shared/github-apps.mjs
    destination: .github/workflows/shared/github-apps.mjs
  - source: .github/workflows/shared/materialize-cao.mjs
    destination: .github/workflows/shared/materialize-cao.mjs
  - source: .github/aw/instructions.md
    destination: .github/aw/instructions.md
