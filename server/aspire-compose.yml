name: cao-local-aspire

services:
  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:18888
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://0.0.0.0:18890
      Dashboard__Otlp__AuthMode: Unsecured
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4318:18890"
