apiVersion: batch/v1
kind: Job
metadata:
  generateName: cao-bootstrap-
  namespace: cao-local-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: cao-db-maintenance:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: cao-database
            - secretRef:
                name: cao-bootstrap
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: ca
          configMap:
            name: cao-postgres-ca
