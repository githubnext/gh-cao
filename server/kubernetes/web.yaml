apiVersion: v1
kind: Service
metadata:
  name: cao-web
  namespace: cao-local
spec:
  selector:
    app: cao-web
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cao-web
  namespace: cao-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cao-web
  template:
    metadata:
      labels:
        app: cao-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: cao-dashboard:local
          imagePullPolicy: Never
          args:
            - serve-hosted
            - --operational-store
            - postgres
            - --listen
            - 0.0.0.0:8443
            - --cert
            - /tls/tls.crt
            - --key
            - /tls/tls.key
          envFrom:
            - configMapRef:
                name: cao-database
            - secretRef:
                name: cao-runtime
            - secretRef:
                name: cao-oauth
            - secretRef:
                name: cao-web-keys
          env:
            - name: CAO_POLICY_PATH
              value: /policy/cao.json
            - name: CAO_EXTERNAL_INGESTION
              value: "true"
            - name: CAO_ALLOWED_HOSTS
              value: localhost
            - name: CAO_GITHUB_REDIRECT_URL
              value: https://localhost:8443/auth/callback
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            tcpSocket:
              port: https
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/readiness
              port: https
              httpHeaders:
                - name: Host
                  value: localhost:8443
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          configMap:
            name: cao-postgres-ca
        - name: tls
          secret:
            secretName: cao-web-tls
            defaultMode: 0440
        - name: policy
          configMap:
            name: cao-policy
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
