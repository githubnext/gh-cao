  - "Gateway handlers MUST consume same-kind batches. Compiler v2 carries distinct aw_context.webhook.deliveries and derives unique aw_context.items; supplied item lists and extra provenance fields are forbidden. Durable immutable provenance MUST bind approved revision evidence passed out of band through CompilerDispatcher; missing capability/evidence blocks sending. Generic routes use a nonempty unique-projection aw_context array, sorted delivery provenance and runtime batch identity. Members MUST share full subscription, artifact/queue revision and immutable source identity; distinct activity history MUST NOT be discarded or replaced with inferred latest state. Long-running roles coalesce for two seconds then permit singleton flushes; local one-shot flushes immediately. At most 64 members and gateway/compiler byte ceilings bound each batch; overflow stays Ready. Persisted tenant/subscription cursor rotation balances routes across replicas; concurrency counts claim groups. All fences and fresh claim-bound evidence MUST precede one atomic group reservation and one rate/quota charge per request; compatible members may share fresh GitHub facts, never admission proofs. Completion MUST atomically fence every member; unknown/lost acceptance MUST NOT cause per-event replay. Workflow dispatch MUST attest gatewayInput and batchInput for all five reserved batch inputs. Legacy singleton wire transport is rejected. RFC-033 section 13.1, batch conformance vectors and the separate dispatch-batch TLA+ model define this contract."
