invariants:
  - "The standalone webhook gateway MUST remain optional, not installed or enabled by default, distinct from dashboard reconciliation and collection, and unable to widen campaign scope, enablement or live authority. Fresh control-plane.webhook-gateway policy in cao.json MUST fail closed without stale fallback and bind exact-SHA artifact digests separately from administrative grants. Production source/destination repositories MUST be private; public/internal, archived, disabled or inaccessible repositories fail closed."
