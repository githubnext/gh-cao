  - "All Redis server profiles MUST apply a configurable Redis cache-pressure budget (default 200,000,000 bytes, capped at 80% of provider-reported maxmemory). Scripted memory introspection gates atomic admission and outgoing-allocation reservations; unsupported providers MUST explicitly disable disposable-cache admission and serving while retaining protected storage. Provider-compatible startup/30-second maintenance MUST use one namespace cursor pass, fresh final pressure evidence, and only current-namespace disposable-cache reclamation. Preserve sessions, queues, quota state, revocation retries and other namespaces; report unattainable protected-state pressure; never change Redis configuration or imply a cluster-wide, process-RSS or persistence-disk cap."
