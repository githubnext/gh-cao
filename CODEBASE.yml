  - "Native setup MAY offer commit/push only after configuration and separate default-No approval of a file summary, policy diff and temporary full-diff file produced with an isolated index. Only exact runtime/package paths prepared by this invocation plus policy are eligible, never unrelated files. Publication MUST require an empty real index, one matching origin push destination, default-branch checkout and equal local/remote HEADs or both unborn; earlier local commits, feature branches and uncommitted earlier runtime require manual publication. Reviewed Git/file/destination state MUST be rechecked before staging, and commit tree, branch and parent verified before normal push. Identity, hooks and protections remain effective; no force, extra tags or submodule pushes. Push failures MUST retain the local commit and report recovery. Declining/cancelling, headless mode and CI MUST NOT publish. Success MUST immediately return Actions/known dashboard links as deployment pending without dispatch, polling or deployment wait. Node onboarding administration MUST NOT be shipped or retained as a parity implementation."
