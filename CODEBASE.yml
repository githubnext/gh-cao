spec: cbm/v0.1

project:
  name: central-agentic-ops
  purpose: >
    Public CAO campaign catalog and source-managed control plane for bounded,
    policy-governed agentic operations across an explicitly enrolled repository fleet.
  stack:
    - GitHub Actions
    - gh-aw
    - Node.js 24
    - ECMAScript modules
    - JSONL
    - SQLite
    - IndexedDB
    - Redis
    - PostgreSQL
    - Go
    - Dashboard Language
    - Astro/Starlight

structure:
  architecture_document: ARCHITECTURE.md
  codebase_model: CODEBASE.yml
  agent_instructions: AGENTS.md
  catalog_manifest: aw.yml
  operations: <operation>/aw.yml
  activity: activity/
  go_extension_entrypoint: cmd/gh-cao/
  go_extension_commands: internal/cli/
  go_extension_github_helper: internal/ghcli/
  go_extension_catalog: dashboard/catalog.go
  local_go_query_engine: internal/dashboardquery/
  dashboard: dashboard/
  dashboard_data: dashboard/site/src/data/
  dashboard_go_server: server/
  webhook_gateway_entrypoint: server/cmd/cao-webhook-gateway/
  webhook_gateway_contracts: server/internal/webhookgateway/
  webhook_gateway_host: server/internal/webhookgatewayhost/
  webhook_gateway_local: server/internal/webhookgatewaylocal/
  webhook_gateway_sqlite: server/internal/operational/sqlite/
  dashboard_server_contract: server/spec/
  dashboard_upstash_profile: server/internal/server/hosted.go
  dashboard_container: server/Dockerfile
  workflow_sources: .github/workflows/*.md
  workflow_artifacts: .github/workflows/*.lock.yml
  workflow_shared: .github/workflows/shared/
  rollout_policy: .github/workflows/cao.json
  deployment_profiles: .github/workflows/cao.<deployment>.json
  campaign_runtime: <campaign>/
  agent_instruction_resources: .github/aw/
  campaign_records: .github/aw/campaigns/
  workflow_agent_skills: .github/skills/
  portable_agent_skills: skills/
  specifications: specs/
  documentation: docs/
  decisions: adr/
  tests: tests/
  utilities: scripts/
  runtime_package: runtime/package.json
  runtime_builder: scripts/build-cao-runtime.mjs
  runtime_distribution: .github/workflows/cao-runtime.yml

architecture:
  style: envelope-first governance kernel with direct operations, standalone workflows, catalog campaigns, and bounded workers
  roles:
    catalog: publishes versioned operation campaigns
    control_repository: owns rollout policy, credentials, installed workflows, and workflow runs
    review_repository: receives declared safe outputs in review mode
    target_repository: supplies source data and receives only declared safe outputs
    gh_aw: compiles workflows and controls execution capabilities, limits, authentication, and safe outputs
  authority: >
    A run's authority is the intersection of reviewed policy, dispatch request,
    worker ceilings, credential reach, and gh-aw-compiled capabilities.
  concepts:
    reviewed_workflow_revision: workflow revision from which policy is resolved
    credentials: GitHub Actions secrets resolved only inside a run
    resolved_policy: effective CAO authority and rollout envelope
    target_repository_mutation: direct target repository modification by an orchestrator
    targets_outside_resolved_policy: repositories not admitted by the effective envelope
    dispatched_target: single repository identity carried by a worker envelope
    declared_safe_output_capabilities: compiled gh-aw repository-write capabilities
    additional_target_discovery: worker discovery beyond its dispatched target
    further_work_dispatch: worker dispatch of additional work
    mode_widening: promotion beyond the envelope or worker mode ceiling
    control_plane_authority: authority to authorize control-plane execution
    bounded_worker_query_payloads: bounded query results sent from the data worker
    source_data_queries: direct source-data queries from UI code
    business_relationship_reconstruction: UI derivation of source-data relationships
    canonical_evidence: source-neutral records with stable identities, relationships, quality, and provenance
    bounded_computation_results: partitioned, versioned measures and actionable insights with bounded evidence references
    computation_authority: authority inferred from a derived computation result
    activity_collection_scope: exact repositories whose workflow evidence Activity may collect, independently narrowed within global rollout scope
    outcome_inference_from_runtime: treating runtime success as verification, accepted outcome, an operational-grader result, or operational value
    request_scoped_computation_results: bounded measure results evaluated for a selected partition and version against canonical evidence
    dashboard_entity_storage: current hosted dashboard entity rows, quality metadata, diagnostics, and revision state
    dashboard_query_execution: Dashboard Language evaluation over current hosted dashboard data
    operational_state_storage: sessions, rate limits, queues, deduplication, coordination, quota state, revocation retries, and bounded caches

components:
  authority_kernel:
    path: .github/workflows/shared/authority.mjs
    responsibility: resolve topology-independent authority ceilings, validate versioned scoped grants and compare verified narrowing without I/O
  direct_operations:
    path: .github/workflows/shared/operations.mjs
    responsibility: adapt explicit operation requests and exact-workflow-SHA policy to run-bound envelopes and fail-closed gh-aw preparation without campaign or inventory topology
  policy_resolution:
    path: .github/workflows/shared/control.md
    responsibility: load policy at the workflow revision and resolve the effective run envelope
  orchestrator:
    path: .github/workflows/<operation>.md
    responsibility: discover, filter, rank, select, and dispatch targets within the resolved policy
  worker:
    path: .github/workflows/<operation>-<worker>.md
    responsibility: revalidate a dispatch or manual-debug envelope, analyze one target, and emit declared safe outputs
  standalone_workflow:
    path: .github/workflows/<workflow>.md
    responsibility: import shared control with an exact workflow identity, admit directly against control-plane.workflows at the workflow SHA, and execute its mission on a deterministically bounded fleet without campaigns, worker inventory, or downstream dispatch
  activity:
    path: activity/
    responsibility: collect bounded evidence, ingest JSONL, create SQLite projections, and provide the cao CLI
  control_plane_setup:
    path: internal/cli/
    responsibility: natively prepare missing monitoring runtime and baseline policy in an existing control checkout, resolve exact repository scope, review intended authority, verify Pages source and public-visibility consent, connect credentials, atomically save policy and optionally publish exact reviewed CAO files after separate interactive approval with a nonblocking deployment-pending handoff
  actions_credentials:
    path: activity/authentication.mjs
    responsibility: Actions-only credential profiles, owner-scoped naming and bounded Activity collection planning; native gh cao setup auth exclusively owns operator provisioning
  dashboard:
    path: dashboard/
    responsibility: publish evidence and build the shared operational dashboard UI for either Pages or the hosted Go server
  dashboard_data:
    path: dashboard/site/src/data/
    responsibility: normalize, persist, and declaratively query canonical browser data in a Web Worker, including separately keyed run-linked experiment assignments, grader observations, and eval observations
  statistical_run_projection:
    path: dashboard/site/src/data/queries/
    responsibility: independently select deterministic seven-day date/outcome-stratified canonical snapshot samples before consumer filters with backend-specific capacities and frame/weight metadata; PostgreSQL atomically freezes bounded complete typed bundles, source quality, and structural parents at snapshot publication and serves statistical dependencies from private non-partitioned copies; incremental revisions mark snapshots stale without changing evidence or weights; SQLite/browser remain query projections; exact sources, retention, Operational Value, and canonical storage stay unchanged; hot eviction and daily aggregates remain separate work
  marketplace_registry_policy:
    path: .github/workflows/cao.json
    responsibility: define ordered campaign package registries, resolver cache policy, and secret references without secret values
  marketplace_static_resolver:
    path: activity/marketplace.mjs
    responsibility: resolve registry refs and gh-aw package manifests during Activity precomputation into safe normalized marketplace package records
  marketplace_hosted_resolver:
    path: server/
    responsibility: resolve the same registry contract at runtime and cache safe normalized results through the operational cache contract
  marketplace_ui:
    path: dashboard/site/dashboard-fragments/operations.json
    responsibility: render declarative package list and detail views with copy-only canonical CAO add commands
  gh_aw_logs:
    external: true
    responsibility: authoritative execution-log source for Activity collection
  activity_jsonl_shards:
    path: activity/
    responsibility: bounded, authoritative Activity evidence snapshots
  activity_run_information_shards:
    path: activity/
    responsibility: compact immutable run identity and aggregate payloads loaded before run-linked records
  activity_record_shards:
    path: activity/
    responsibility: detailed domain, tool, audit, and issue payloads with direct canonical run identity
  sqlite_projection:
    path: activity/
    responsibility: rebuildable local query projection for the cao CLI and agents
  dashboard_publisher:
    path: dashboard/
    responsibility: publish inventory, SQLite, and compacted normalized run and record shards without raw Activity JSONL
  browser_data_worker:
    path: dashboard/site/src/data/
    responsibility: download, normalize, persist, and query browser data off the main thread
  indexeddb_projection:
    path: dashboard/site/src/data/
    responsibility: rebuildable per-browser data projection
  postgres_entity_store:
    path: server/internal/postgresx/
    responsibility: bootstrap a fresh TypeSpec-generated schema and UTC daily partitions as owner; runtime opens validated provisioned state without DDL, with a fixed schema-qualified ANALYZE capability; daily owner maintenance preserves historical, current, and 28 upcoming days and expires only complete days at configured cutoffs; weekly layouts require a fresh canonical schema rebuilt from authoritative inputs without removing operational audit/queue state; transactionally replace and read query-minimal native entity tables, entity-owned relational child values, quality metadata, diagnostics, and revision state; preserve missing versus null with compact presence bits; compile and execute bounded Dashboard Language plans as SQL in a repeatable-read snapshot without persisted documents, duplicate scalar representations, or compatibility migrations
  canonical_storage_contract:
    path: server/internal/dashboardstore/
    responsibility: accept existing canonical storage readers without changing PostgreSQL SQL execution or ingestion
  local_sqlite_entity_store:
    path: server/internal/sqlitex/, server/internal/server/local_sqlite.go
    responsibility: default local serve to a cached canonical snapshot with loopback bearer authentication and read-only request transactions; acquire missing files from DASHBOARD_DATA_URL or public CAO Pages, with --sqlite selecting another cache and --download-sqlite explicitly refreshing; accept any Pages/custom-domain site, dashboard directory or manifest URL, discover the root manifest then cao/ on HTTP 404, stream bounded data and verify SHA-256 plus canonical version before atomic replacement, preserving the previous file and failing startup on error; fail closed for invalid or unreadable existing caches and dangling symlinks without repair downloads; outside the internal canvas, attach the snapshot read-only to a separate writable delta with shared internal/dashboardquery/overlay.sql, local upserts and tombstones, no historical record copy and a fail-closed canonical-content revision binding; refresh only snapshot-declared repositories with local GH_TOKEN, GITHUB_TOKEN or gh login through existing Activity collection/compaction and canonical ingestion, stage only the delta, discard and report failed repository evidence independently, atomically publish successful ingestion with stale-writer rejection and revision notification, remove private pass evidence and cancel/join work on shutdown; bound scope to 10000 repositories, collection to 10000 runs and five minutes per repository within 30 days with a one-day watermark overlap and older unfinished runs, and passes to 30 minutes; repeat five minutes after each pass with --backfill-interval override and --backfill=false for offline reuse including local data; expose ordinary HTTP, canonical API, diagnostics, revision subscriptions and optional MCP with bounded volatile request services, unknown snapshot quality and no query result caching; preserve snapshot-only canvas and never enable hosted OAuth, collection, ingestion, webhooks, hosted execution, token-driven inventory expansion, rollout changes or PostgreSQL fallback
  local_go_query_engine:
    path: internal/dashboardquery/
    responsibility: share the bounded native Dashboard Language evaluator and canonical SQLite reader through a small independent Go module, without coupling the extension and server dependency graphs; local server snapshots explicitly admit 500000 input/intermediate rows and 50 million operations with 1 GiB working-source and 2 GiB / 2 million live retained-row budgets, release inputs after their final consumer, prune unused pure row-local computations and push live root fields into SQLite while preserving full-record byte checks, JSON types, missing fields, UTF-16 key ordering, complete requested raw sources and unknown shapes; cap readonly mmap at 1 GiB, execute remaining operators in Go, use a local-only default 300-unit/minute weighted query-admission bucket with explicit overrides preserved, and preserve 100000-row wire limits plus existing CLI/hosted defaults
  redis_operational_store:
    path: server/internal/redisx/
    responsibility: support operational caches, queues, and sessions, not dashboard entity storage or query execution
  operational_contracts:
    path: server/internal/operational/
    responsibility: define typed narrow cache, OAuth, limiter, quota, collection, coordination and diagnostic services with immutable per-feature scope and restart-persistence capabilities, mandatory atomicity and CAS, central fail-closed requirement validation, and application-owned maintenance lifecycle
  memory_operational_store:
    path: server/internal/operational/memory/
    responsibility: implement bounded process-scoped volatile operational services shared by OAuth, HTTP admission, quota, collection, projection and backfill in one owning process, with restart-invalidated sessions and login state and explicit incomplete recovery
  postgres_operational_store:
    path: server/internal/operational/postgres/
    responsibility: implement default durable deployment-scoped typed operational services in separate cao_operational tables, with namespace-row transactional serialization, database-time expiry, replica-consistent protected and cache budgets, atomic session revocation capacity, bounded maintenance, and read-only existing-state diagnostics; separate owner bootstrap, runtime audit SELECT/INSERT and namespace budget updates, SELECT-only evidence access, and owner-defined 400-day/512-row audit retention under a separately granted capability with pinned search path; runtime performs no DDL, namespace destruction, or audit retention; operator migration/grants/schedules are in server/POSTGRES.md; never store canonical entities or execute dashboard queries
  activation_admission:
    path: server/internal/admission/
    responsibility: implement explicitly configured hosted OIDC-only gh-aw admission independently of CAO rollout; verify GitHub.com string-audience signed immutable repository/workflow revision/original-actor identity and exact enrollment against an atomic protected policy/fresh AI Credits accounting snapshot; deny ambiguous reusable calls; consume a narrow PostgreSQL-backed durable first-decision contract with a fixed five-minute authorization window and permanent bounded-capacity expiry/revocation tombstones; revalidate on every retry without replacing allowances or losing records on outages; receive separately authenticated /api/conclusion compact sessions under current exact enrollment independently of spend/prior admission, retain atomic immutable receipts and publish partial canonical Run/Audit/grader facts before durable completion/acknowledgement; repair pending publication idempotently, keep fixed 24-hour request retention and permanent protected-capacity digest/completion tombstones, and let typed facts follow canonical retention and winning-attempt precedence; never fetch artifacts, present compact evidence as complete accounting, infer GitHub workflow outcomes, mutate finances, accept dashboard sessions, echo trace IDs, authorize from workflow hashes/unverified rerun initiators, or widen CAO scope; native internal/cli admission setup/status/disable previews or explicitly applies exact-repository non-secret managed variables, defaults setup to block, writes URL last, resolves inheritance and disables with an empty URL override without authority deployment/enrollment or rollout changes
  sqlite_hosted_cli_store:
    path: server/internal/operational/sqlite/
    responsibility: provide local single-host hosted-CLI queues, token cleanup journal and audit history; explicit database bootstrap provisions state, runtime opens existing state without DDL or implicit audit retention, database retain-audit removes a bounded expired prefix, and audit deliver uses read-only deferred verification while audit verify appends its outcome; never replace canonical dashboard storage or claim PostgreSQL database-role isolation
  dashboard_query_result_cache:
    path: server/internal/redisx/query_cache.go and server/internal/server/query_cache.go
    responsibility: cache expensive compact HTTP and MCP query results by SHA-256 query identity for five minutes through the operational contract, with atomic expiry, Redis allocator or memory accounting limits and bounded eviction; key value-evidence-dependent queries by canonical revision so publication refreshes active reports
  dashboard_https_server:
    path: server/
    responsibility: serve hosted dashboard HTML and assets, OAuth, APIs and revision events on one origin; require a readable non-empty built index.html and inject the server-http bootstrap; independently resolve compiled app-target and operational-backend modules from non-secret cao.json, default to durable PostgreSQL operational storage without Redis while preserving explicit Redis and bounded single-process volatile memory alternatives, ingest deployed artifacts into Postgres, execute hosted Dashboard Language plans through the PostgreSQL SQL engine with registered runtime sources, and serve bounded query results
  dashboard_http_contract:
    path: server/spec/
    responsibility: specify public HTTP/SSE and fresh Postgres storage contracts in TypeSpec; generate checked OpenAPI, wire JSON Schemas, standalone SQL DDL, and Go entity bindings; enforce query-field coverage and column minimization
  dashboard_external_host:
    path: server/hosting/
    responsibility: expose the complete hosted CAO handler and cancellation-aware application startup to a separately owned HTTP listener without exporting Redis or authentication internals
  dashboard_container_build:
    path: server/Dockerfile
    responsibility: build host-neutral dashboard and collector targets from a source revision, package a deterministic source-bound control-plane inventory with the minimal shared policy resolver, and leave deployment promotion and rollback to the application host
  dashboard_observability:
    path: server/internal/telemetry/, server/internal/server/, dashboard/site/src/remote-data-backend.js
    responsibility: export vendor-neutral OTLP traces and metrics plus explicitly enabled DEBUG-selected logs, correlate bounded server errors and browser failures through matching W3C trace/span identifiers, and keep exporter credentials and internal failure details outside responses and logs
  dashboard_server_package:
    path: .github/workflows/cao-package.yml
    responsibility: validate protected source authority, test and independently scan, and seal the deployment-neutral multi-role CAO server image without package-write authority
  dashboard_server_package_publisher:
    path: .github/workflows/cao-package-publish.yml
    responsibility: execute from protected main, revalidate caller and package authority, verify sealed metadata and OCI labels, and immutably publish and attest the CAO server image
  dashboard_upstash_deployment:
    path: server/internal/server/hosted.go
    responsibility: run one hosted replica over one fail-closed serialized Upstash TCP session with a fresh process namespace and artifact-only ingestion
  dashboard_canonical_api:
    path: server/internal/server/
    responsibility: expose canonical repositories, workflows, and runs without exposing Redis keys or representations
  dashboard_github_auth:
    path: server/internal/server/oauth.go
    responsibility: authenticate hosted users through GitHub and enforce explicit organization or team authorization with server-side sessions; explicitly opted-in loopback TLS development authorizes one configured developer without organization scopes or membership reads
  dashboard_webhook_reconciliation:
    path: server/internal/server/operations.go
    responsibility: verify and deduplicate GitHub deliveries and reconcile the disposable projection from authoritative inputs
  webhook_gateway:
    path: server/cmd/cao-webhook-gateway/
    responsibility: compose optional isolated production receive/dispatch processes or an explicit non-authoritative local simulation, independent of dashboard reconciliation and collection, with cancellation-owned shutdown
  webhook_gateway_contracts:
    path: server/internal/webhookgateway/
    responsibility: own bounded subscription contracts, native external authentication/normalization, exact GitHub notification catalog, matched-literal projection, generic predicates, organization selectors, authorization and dispatch-outcome decisions
  webhook_gateway_host:
    path: server/internal/webhookgatewayhost/
    responsibility: adapt existing App authentication, quota, request limits and operational StateStore proofs to gateway contracts without exposing App keys to receive
  webhook_gateway_queue:
    path: server/internal/operational/postgres/webhook.go
    responsibility: extend the existing operational adapter with namespace-isolated cao_operational_webhook tables, atomic bounded batch admission, monotonic policy revisions, database-time leases and fenced CAS transitions, separate from canonical schema and collection jobs
  webhook_gateway_local:
    path: server/internal/webhookgatewaylocal/
    responsibility: poll one explicit immutable repository through bounded GET-only Events API reads, recognize known event IDs through committed retained receipts without re-signing mutable feed payloads or weakening ingress digest conflicts, sign new in-process HTTP deliveries through real ingress and workers, and provide clearly synthetic fixture authorization and dispatch acceptance without production credentials or authority
  webhook_gateway_sqlite:
    path: server/internal/operational/sqlite/
    responsibility: implement only the local gateway Queue contract with private WAL-backed files, atomic bounded receipts/fanout, persisted revisions and rate budgets, database-time leases, fenced CAS transitions and terminal ambiguity across restart; not a hosted operational.Store
  dashboard_server_collection:
    path: server/internal/collect/
    responsibility: optional alternative ingestion profile that discovers paginated historical workflow runs into durable resumable run tasks, resolves reviewed policy over exact operational enrollment, enriches source-bound campaign inventory with short-lived installation authority, and retains repository and inventory evidence in a snapshot-compatible lake loaded through the existing ingestion pipeline
  dashboard_collection_health:
    path: server/internal/server/collecting.go
    responsibility: persist allowlisted Redis-backed ingestion counters and expose a read-only health API and admin-authorized collection-health runtime source through the query boundary
  dashboard_collection_credentials:
    path: server/internal/githubapp/
    responsibility: mint short-lived installation tokens and govern per-installation GitHub rate-limit budget
  github_quota_service:
    path: server/internal/githubquota/
    responsibility: coordinate GitHub API quota across replicas for buckets keyed by app, installation, and resource through authoritative observations, expiring atomic operational reservations, parking, a credential-free provider registry, headroom-based bucket selection, and a bounded 24-hour usage history exposed to administrators through a REST API and the github-quota-usage runtime source
  dashboard_rebuild_control:
    path: server/internal/server/operations.go
    responsibility: coordinate multi-replica rebuilds, validate and transactionally replace current Postgres sources, and report operational status
  dashboard_server_diagnostics:
    path: server/internal/doctor/
    responsibility: run a read-only systematic check-up of runtime configuration, selected operational guarantees and capacity, Postgres canonical state and integrity, query definitions, and optional collection health, rendered as text or versioned structured JSON
  dashboard_language_queries:
    path: dashboard/site/src/data/ and server/internal/query/
    responsibility: execute declarative canonical-data queries in the browser worker and registered bounded runtime-source queries at the server boundary
  computations:
    path: specs/computations.md
    responsibility: define deterministic partitioned measures that transform canonical evidence into bounded actionable insights
  package_operational_value:
    path: <operation>/operational-value.mjs
    responsibility: compute timestamped repository-scoped metrics for installed packages through the cao operational-value command
  workflow_value_publication:
    path: server/internal/server/value.go
    responsibility: authenticate explicit administrator publication of original bounded evidence through POST /api/v1/value, with PostgreSQL namespace-locked atomic packet/fact ownership preserved across snapshot replacement, idempotent exact retries, frozen contracts and immutable historical measurements; never register or execute uploaded code
  workflow_value_collection:
    path: activity/workflow-values.mjs
    responsibility: publish reviewed exact-registration collection health through the canonical browser/SQLite/PostgreSQL pipeline independently of accepted evidence; reconcile decision and actual-attempt clocks independently of arrival order without erasing known attempts; preserve capture/cutoff clocks, explicit disables, scope and proof; defer recurring remote acquisition pending enforceable shared per-request budgets rather than spending ordinary Activity headroom
  local_value_computation:
    path: activity/local-values.mjs
    responsibility: compute bounded local values only after eligible policy-matched Activity publication, using the reviewed local-only standard adapter, explicit local-capability modules or exact versioned cache reuse; no target credentials or automatic backfill; two-minute batch and thirty-second adapter limits; hosted work owns a separate lease and verified snapshot without the projection lease or long evidence lock; final publication rechecks enrollment and starting generation, manifest, policy and retained-result identities, deferring changed inputs; a later ordinary snapshot publishes results without a compute/publication retry loop
  package_problem_clustering:
    path: <operation>/problem-clustering.mjs
    responsibility: compute bounded package problem rows from a private Activity SQLite snapshot through the cao cluster-problems command
  computation_reference_runtime:
    path: research/computations/
    responsibility: experimentally evaluate proposed versioned measures over selected and ordered partitions without implying dashboard production integration
  computation_research_notebooks:
    path: research/
    responsibility: validate computation contracts against local canonical evidence and present explainable drill-downs
  dashboard_ui:
    path: dashboard/site/
    responsibility: render bounded Dashboard Language query payloads
  local_dashboard_server:
    path: server/cmd/cao-dashboard/
    responsibility: unify local SQLite serve, reviewed PostgreSQL/OAuth serve-hosted, and explicit loopback-only serve-pages for unchanged built Pages artifacts and repository base paths without hosted bootstrap or APIs; npm dev and dashboard:local build the site and invoke Go, never a Node launcher
  dashboard_pages_simulation:
    path: scripts/simulate-dashboard-pages.mjs
    responsibility: prepare built static Pages output through production Activity normalization/SQLite ingestion and Dashboard building from an existing snapshot or explicitly labelled fixture, without simulating collection, Actions authority or artifact transport
  canvas_authoring_bridge:
    path: dashboard/canvas-server.mjs
    responsibility: privately provide Copilot canvas JSON composition/reload, authoring callbacks, bounded local-user GitHub reads and trusted commands; Go owns the capability-protected public origin, assets and canonical SQLite APIs and proxies only integration routes; paired trusted execution and approval adapters are required for commands
    launcher: dashboard/canvas-go-host.mjs
    lifecycle: launch bundled Go sources/native query module or an explicitly selected compatible executable, never workspace code; stdin lifetime terminates the child when its owner exits; stop before removing staging, including failed startup
    data_contract: require a checksum-verified published canonical SQLite snapshot; optional published inventory quality is metadata only and missing quality stays unknown; no Node query backend, logical-source transport or browser-ingestion fallback
    prohibited: standalone Node CLI, admin mode, process replacement, hosted App authority for local-user GitHub reads
  local_cli_queue:
    path: dashboard/cli-action-queue.mjs
    responsibility: own durable single-owner FIFO operational SQLite commands independently of browser lifetimes, with bounded concurrency, deadlines, cancellation, ordered output, retry ancestry and terminal-only UTC weekly retention
  cli_command_storage:
    path: server/internal/operational/cli_commands.go
    responsibility: define focused CLICommandQueues and CLICommandQueue services separate from collection tasks and execution authority, with restart durability, fenced ownership, explicit uncertainty recovery, settlement-protected slots, bounded output cursors and UTC weekly retention
  postgres_cli_commands:
    path: server/internal/operational/postgres/
    responsibility: expose CLICommands through operational composition using namespace-isolated cao_operational_cli tables, database-time leases, monotonic fences, protected byte and entry budgets and bounded terminal-only maintenance; never enable hosted execution by themselves or replace the local SQLite executor
  hosted_cli:
    path: server/internal/hostedcli/
    responsibility: experimental opt-in (--experimental --hosted-cli-actions) admission of catalog-declared actions by step-up administrators and an execute-cli drain that rechecks live write permission, Go-plans only gh or gh-aw entrypoints, and runs commands through ContainerLifecycle with a private workspace and single-use repository-scoped GitHub App token; production Docker requires network-none, a private read-only Unix proxy socket, an immutable exact-host policy, and a reviewed SHA-256-verified architecture-matched relay; validate every DNS address before numeric HTTPS dialing, allow private GHES only by exact host/IP, deny metadata/loopback/link-local, and cancel bounded proxy lifetime without releasing uncertain claims; no shared host-network changes; SQLite Docker with no egress settings retains bridge compatibility, and SQLite may select Apple container or Windows Sandbox; reject/revoke over-broad grants
  security_audit:
    path: server/internal/audit/
    responsibility: credential-free audit events for admin denials, hosted CLI admission and execution, and token lifecycle in hash-chained append-only cao_operational_audit_events (or loopback-only development SQLite); queue results, settlement and recovery atomically append evidence, with state-guarded replay and retained uncertain claims; CAS token journals replace encrypted ownership with non-expiring credential-free receipts independently of audit availability, then atomically append evidence and delete receipts without repeating external effects; capacity backpressures issuance, remote revoke-before-receipt persistence remains explicitly uncertain; complete forwarding consumes committed rows, while logger-produced events also use JSON mirrors and OTLP; hashed_token identifies credentials; audit verify checks external anchors and audit export writes JSON Lines
  cli_executor:
    path: dashboard/cli-actions.mjs
    responsibility: execute the existing validated CLI mechanism with bounded output and process-tree termination
  cli_quota_bridge:
    path: server/cmd/cao-cli-quota/
    responsibility: reuse GitHub quota tracking for the local queue against authoritative execution-credential observations, failing closed when evidence is unavailable
  cao_cli:
    path: activity/cao.mjs, activity/cli/, activity/commands/
    responsibility: preserve executable and public exports in cao.mjs, separate dispatch and implementation concerns in cli/, provide one handler per command in commands/, and own the supported Actions runtime including workflow-agent evidence APIs for discovery, prompts, canonical queries, GitHub-shaped local evidence reads, computations, MCP and downloads; retain these commands and their dependencies in the installed runtime despite intentional overlap with operator gh cao; implementation modules depend on shared helpers, not the entry point
  go_extension_entrypoint:
    path: cmd/gh-cao/
    responsibility: own process lifecycle and version for the native gh cao extension in the independent root Go module
  go_extension_commands:
    path: internal/cli/
    responsibility: implement every operator command in Go, including onboarding/authentication, bounded campaign materialization, review-safe enrollment and policy management, downloads, read-only SQLite and Dashboard Language queries, advisory computations, MCP, and diagnostics using github.com/github/gh-aw/pkg/logger
  go_extension_github_helper:
    path: internal/ghcli/
    responsibility: execute context-aware GitHub CLI calls and a bounded local version check using github.com/cli/go-gh/v2, the same helper used by gh-aw
  go_extension_catalog:
    path: dashboard/catalog.go
    responsibility: embed the authoritative dashboard JSON, fragments, canonical query projections and MCP contract for standalone native command execution

dependencies:
