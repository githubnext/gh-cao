  - "The runtime pipeline MUST build/test with read-only permission on main pushes and attest in a source-free job. The Release workflow MUST create a draft stable tag at an exact main SHA, wait for that SHA's successful cao-runtime.yml push run, verify the checksums and GitHub-hosted signed provenance of the runtime archive and the Azure deployment-asset bundle, attach both archives and checksums together with versioned extension assets to the draft, and fail closed without publication for missing, failed, mismatched, self-hosted, incomplete, or unverifiable evidence. Publication creates an immutable prerelease before the highlights agent updates notes; a maintainer reviews and promotes it to stable. Immutable release tags and assets MUST NOT be mutated or overwritten after publication. Main artifacts have 90-day retention. Normal installation requires Node.js and authenticated GitHub CLI artifact and attestation access, not npm; explicit developer source materialization may use npm, and dashboard builds retain production dependency installation."
  - "gh cao MUST own operator onboarding/lifecycle, cao-dashboard the server, and Node cao the Actions runtime. Retired Node init, setup, setup-auth, add, mode, enable, disable, update and upgrade-gh-aw MUST reject before option parsing, stdin consumption or legacy two-argument ingestion, with native replacement guidance and no compatibility wrappers. Source and installed runtimes MUST exclude obsolete Node administration modules. activity/authentication.mjs retains Actions profiles, naming and bounded collection planning only. Native gh cao add installs workflows and campaign packages, not repositories; no campaign-add subcommand is provided."
