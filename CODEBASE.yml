  - "Local serve MUST default to SQLite and acquire verified deployed data only when missing; --sqlite selects another cache and --download-sqlite explicitly refreshes. --backfill=false MUST reuse existing snapshot and delta offline. Outside the snapshot-only internal canvas, native ATTACH MUST keep historical records read-only while local-token refresh writes a separate revision-bound delta; staging MUST copy only local data, discard failed repository evidence, publish atomically after successful canonical ingestion, reject concurrent stale generations, and preserve committed data on failure. Scope MUST come only from snapshot repositories, never credential reach or new rollout authority; credentials MUST NOT enter SQLite or the browser. Explicit --postgres-url, --source or --redis-url selects PostgreSQL; database service environment variables alone MUST NOT override the local SQLite default. SQLite MUST remain loopback-only and bearer-authenticated and open canonical snapshots read-only without bootstrap, migration, repair or ingestion; invalid or unreadable existing caches and dangling symlinks MUST fail closed without automatic repair downloads. It MUST NOT change hosted PostgreSQL execution, ingest behavior or defaults, become a fallback from a failed PostgreSQL connection, enable hosted capabilities, or cache stale query results. In-place commits MUST notify revision subscribers; quality stays unknown without stronger evidence."
