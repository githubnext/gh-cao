  - "PostgreSQL is the default operational adapter for selector-free reviewed hosts and local serve. Explicit Redis configuration remains supported and credentials alone MUST NOT override reviewed selection. Memory MUST require OAuth, HTTPS, explicit single-process and volatile-state acknowledgements, and one instance shared by HTTP, quota, workers, projector and backfill; it MUST reject platform listeners, admission-only topology, separate worker/backfill processes and multiple replicas. PostgreSQL operational storage MUST remain independent of canonical entities, generated schema and query execution; there is no automatic migration, failover or dual write."
