  - "Direct operations MUST bind control-plane.operations exact workflow identities to explicit targets via shared/operation.md, without campaign/worker records or inventory topology. Identity conflicts MUST reject. V1 envelopes MUST bind repository, policy SHA, workflow reference, run and attempt, and pair target/mode/destination per grant. Precompute MUST re-resolve exact-revision policy and compare the admitted envelope before preparation. Unsupported required controls, redirects, archived/disabled repositories and missing evidence MUST fail closed. Multiple targets MUST be review-only with a common destination; live requires one target_repo and compiled target-bound safe outputs. An envelope MUST NOT grant credentials, gh-aw capabilities or delegation; narrowing comparisons require independently verified inputs. Pooled allowances, arbitrary delegation and runtime plugins are unsupported."
