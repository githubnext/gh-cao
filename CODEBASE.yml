generation:
  codebase_model:
    path: CODEBASE.yml
    source: ARCHITECTURE.md
    compilation_skill: .github/skills/codebase-model/SKILL.md
  dashboard_static_control_plane_inventory:
    source: aw.yml, campaign aw.yml files, .github/workflows workflow sources, compiled lock files, campaign records, intelligence declarations, and cao.json
    output: collector image /app/catalog/control-plane-inventory.json
    command: REPORT_ROOT=/workspace REPORT_INVENTORY=/tmp/control-plane-inventory.json REPORT_INVENTORY_STATIC=true node activity/inventory.mjs
  dashboard_server_package:
    path: .github/workflows/cao-package.yml
    output: ghcr.io/githubnext/gh-cao/cao-server
  control_runtime_package:
    source: runtime/package.json
    builder: scripts/build-cao-runtime.mjs
    workflow: .github/workflows/cao-runtime.yml
    output: cao-runtime-<resolvedCommit>.tgz
    command: npm run runtime:pack -- DESTINATION REVISION
  azure_deployment_assets:
    source: allowlisted server/Dockerfile Azure-target build inputs and server/azure/main.json; never adopter policy, credentials, tests, or docs
    builder: scripts/build-cao-azure-assets.mjs
    workflow: .github/workflows/cao-runtime.yml
    output: cao-azure-<resolvedCommit>.tgz with cao-azure.json per-file SHA-256 manifest
    command: npm run build:azure-assets -- DESTINATION REVISION
  go_extension_release:
    source: cmd/gh-cao/, internal/, go.mod, go.sum
    builder: scripts/build-release.sh
    workflow: .github/workflows/release.md
    output: dist/gh-cao/gh-cao-{darwin,linux,windows}-{amd64,arm64}[.exe] and checksums.txt
    command: make release VERSION=vX.Y.Z
  dashboard_postgres_schema:
    source: server/spec/storage.tsp
    emitter: server/spec/postgres-emitter.mjs
    outputs:
      - server/internal/postgresx/schema.sql
      - server/internal/postgresx/schema.gen.go
    command: npm --prefix server/spec run generate:storage
  new_operation:
    path: <operation>/aw.yml
  workflow_source:
    path: .github/workflows/<workflow>.md
  shared_workflow_control:
    path: .github/workflows/shared/
  workflow_agent_skill:
    path: .github/skills/<name>/SKILL.md
  portable_agent_skill:
    path: skills/<name>/SKILL.md
  architecture_decision:
    path: adr/
  normative_contract:
    path: specs/
  repository_layout_installation_specification:
    path: specs/repository-layout-and-installation.md

commands:
  repository_root:
    working_directory: .
    entries:
      full_validation: npm run check
      go_extension_build: make build
      go_extension_check: make check
      control_typecheck: npm run typecheck:cao
      tests: npm test
      unit_tests: npm run test:unit
      integration_tests: npm run test:integration
      daily_run_counts_conformance: POSTGRES_URL=... npm run test:conformance:daily-run-counts
      campaign_lifecycle_tests: npm run test:campaign-lifecycle
      campaign_root_tests: npm run test:campaign-root
      runtime_installation_tests: npm run test:runtime-install
      load_tests: npm run test:load
      svg_check: npm run check:svg
      workflow_compile: npm run compile
      manual_workflow_compile: gh aw compile --schedule-seed githubnext/gh-cao
      workflow_compile_locks: npm run compile:locks
      docs_build: npm run docs:build
      dashboard_local: "npm run dashboard:local"
      dashboard_pages_build: "npm run dashboard:pages:build -- --fixture"
      dashboard_pages_serve: "npm run dashboard:pages -- --base-path /gh-cao/"
      dashboard_server_lint: npm run dashboard:server:lint
      dashboard_server_tests: npm run dashboard:server:test
      dashboard_server_e2e: npm run test:e2e:dashboard-server
      runtime_health: cao computation runtime-health [--campaign SLUG]
  dashboard_site:
    working_directory: dashboard/site/
    entries:
      tests: npm test
      e2e_tests: npm run test:e2e
      performance_tests: npm run test:performance
      lint: npm run lint
      typecheck: npm run typecheck
      corpus_validation: npm run validate:corpus
  dashboard_server:
    working_directory: server/
    entries:
      tests: go test ./...
      local_gateway_conformance: go test -race ./internal/operational/sqlite ./internal/webhookgatewaylocal ./cmd/cao-webhook-gateway
      redis_up: docker compose up -d
      redis_down: docker compose down
      container_contract_tests: node --test ../tests/unit/dashboard-container-contract.test.mjs
      container_image_build: docker build -f Dockerfile ..

validation:
  go_extension_command_refs:
    - commands.repository_root.entries.go_extension_check
  default_command_refs:
    - commands.repository_root.entries.full_validation
  dashboard_site_command_refs:
    - commands.dashboard_site.entries.tests
    - commands.dashboard_site.entries.e2e_tests
    - commands.dashboard_site.entries.performance_tests
    - commands.dashboard_site.entries.lint
    - commands.dashboard_site.entries.typecheck
    - commands.dashboard_site.entries.corpus_validation
  dashboard_server_command_refs:
    - commands.repository_root.entries.dashboard_server_lint
    - commands.repository_root.entries.dashboard_server_tests
    - commands.repository_root.entries.dashboard_server_e2e
    - commands.dashboard_server.entries.tests
    - commands.dashboard_server.entries.local_gateway_conformance
  daily_run_counts_command_refs:
    - commands.repository_root.entries.daily_run_counts_conformance
  workflow_source_command_refs:
    - commands.repository_root.entries.workflow_compile
  workflow_source_generated_artifact_command_refs:
    - commands.repository_root.entries.workflow_compile_locks
  campaign_lifecycle_command_refs:
    - commands.repository_root.entries.campaign_lifecycle_tests
    - commands.repository_root.entries.campaign_root_tests
  load_command_refs:
    - commands.repository_root.entries.load_tests
  control_source_command_refs:
    - commands.repository_root.entries.control_typecheck
    - commands.repository_root.entries.tests
  svg_command_refs:
    - commands.repository_root.entries.svg_check
  documentation_command_refs:
    - commands.repository_root.entries.docs_build
  architecture:
    - "Verify non-authoritative local gateway isolation, read-only polling and durable SQLite conformance against specs/rfc-034-local-webhook-gateway.md and its bounded TLA+ model."
    - "Verify optional gateway isolation, fresh policy and grants, monotonic revisions, fenced atomic bounds and terminal ambiguity against specs/rfc-033-webhook-gateway.md; do not infer production readiness from fixtures."
    - "Verify campaign contents against root and campaign aw.yml manifests."
    - "Verify policy and workflow changes are reviewed together."
    - "Verify workflow sources, not generated lock files, are edited."
    - "Verify dashboard data access crosses either the Web Worker or Go HTTP(S) server declarative query boundary."
    - "Verify hosted dashboard entities and queries use Postgres, while Redis remains operational-only."
    - "Changes to the daily run-count projection, reconciliation, retention, source, or migrated consumers require the additional daily-run-count conformance gate against an isolated PostgreSQL database whose test role can create schemas, with native Chromium installed. Skipped backends or browser emulation alone are not conformance; npm run check does not execute this gate."

provenance:
  source: ARCHITECTURE.md
  status: experimental compiled representation; ARCHITECTURE.md remains the human-oriented source
  relationship_namespaces:
    dependencies_and_flows: architecture.roles and components
    boundary_subjects: architecture.roles and components
    boundary_values: architecture.concepts
  intentionally_compressed:
    - Architectural history, examples, diagrams, and explanatory prose
    - Individual leaf files and campaign inventory details
    - Detailed normative contract text; retain it in specs/

benchmark:
  hypothesis: >
    This model preserves the architectural constraints needed for safe repository
    modification with materially less context than ARCHITECTURE.md.
  compare:
    - no_architecture_context
    - full_ARCHITECTURE.md
    - CODEBASE.yml
  measure:
    - task_completion
    - architectural_violations
    - incorrect_file_placement
    - dependency_violations
    - test_failures
    - token_usage
    - tool_calls
    - time_to_completion
