  - "Primary onboarding MUST use gh extension install githubnext/gh-cao followed by gh cao setup in an existing GitHub checkout root. Documentation MUST present the curl install-gh-cao.sh fallback in a callout for SAML-token installation failures, not as the default. The fallback installer requires Node.js 24+, invokes upstream github/gh-aw install-gh-aw.sh, and MUST keep public tool release discovery/downloads anonymous and independent of curl authentication configuration, operator tokens and Actions INPUT_VERSION; preserve stored credentials and authenticated control-repository/runtime-provenance operations. Missing policy MUST share the exact campaign-free baseline constructor with optional policy-only init; malformed existing policy MUST fail without replacement. Native setup's missing runtime MUST be staged by gh-aw in an isolated checkout at a selected stable release and materialized through shared exact-SHA attestation/inventory verification before preflighting all destinations and adding only missing files. Matching files, existing policy and unrelated files MUST be preserved; conflicts MUST stop preparation before Pages or credential mutation. Complete runtime MUST be reused, not upgraded. Missing gh-aw may be installed at the catalog minimum; existing older/broken extensions require explicit repair. Native setup needs no local Node.js and MUST NOT create repositories, change process cwd, enroll campaigns or execute work; repository creation/cloning belongs to gh repo create/clone or the installer's explicit --create-repo. Commit/push requires separate interactive default-No publication approval after configuration. Failures MUST disclose prepared local files and possible partial external changes, not claim rollback."
