  - "CAO_GITHUB_LOCAL_USER development OAuth MUST authorize exactly one configured login with a valid numeric GitHub ID, request classic read:user without read:org, and preserve GitHub App offline_access. It MUST require process-owned loopback TLS, one matching allowed host, exact callback authority/path and loopback peers; reject proxy trust, external/platform hosting, CORS and mixed user/org/team/SSO policy; bind sessions to the mode and developer; preserve admin allowlisting, recent OAuth assurance, CSRF, explicit classic repo consent and live target writer checks. Operators MUST NOT expose the development listener through tunnels or proxies."
